          <div class="names">${names}</div>
          <p class="tip"><b>처음이라면</b> 위의 <b>규칙</b>을 한 번 읽고 시작하세요. 한 판은 30분 안팎입니다.</p>
        </section>
        <section class="panel stack">
          <div><p class="kicker">이번 판의 얼굴들</p><h3>역할 구성</h3></div>
          <div class="comp">${chips(g, "good")}${chips(e, "evil")}</div>
          <p class="note">${J(ROLES.star.name, "과", "와")} ${J(ROLES.assassin.name, "은", "는")} 항상 들어갑니다. 빈자리는 ${J(ROLES.guard.name, "과", "와")} ${J(ROLES.spy.name, "이", "가")} 채웁니다.</p>
          <div class="opts">${opts}</div>
          ${c.opts.wisp && !c.opts.watch ? `<p class="warn">${J(ROLES.watch.name, "이", "가")} 없으면 ${J(ROLES.wisp.name, "은", "는")} 평범한 ${J(ROLES.spy.name, "과", "와")} 같습니다.</p>` : ""}
          <div class="opts"><button class="opt" data-act="lady" aria-pressed="${!!c.lady}"><span class="box"></span><span><span class="t">${T.lamp}</span> <span class="d"><span class="side-r">규칙</span> · 둘째·셋째·넷째 ${T.unit} 뒤, 한 사람의 편을 몰래 살펴본다 (7명 이상 추천)</span></span></button></div>
          <div class="stack" style="gap:6px"><p class="sub-h">찬성·반대 표결</p>
            ${seg("vmode", c.voteMode, [["open", "엄지로 동시에 공개"], ["secret", "돌려가며 몰래 입력"]])}
            <p class="note">${c.voteMode === "open" ? "모두 엄지를 동시에 들고 한 사람이 화면에 옮겨 적습니다. 빠릅니다." : "태블릿을 돌려 한 명씩 고른 뒤 한꺼번에 공개합니다."}</p></div>
          <div class="stack" style="gap:6px"><p class="sub-h">원정대 토론 타이머</p>
            ${seg("tmode", c.timer, [[0, "없음"], [60, "1분"], [120, "2분"], [180, "3분"]])}</div>
          <button class="btn gold big wide" data-act="start">역할 나누기</button>
        </section>
      </div>${legalHTML()}`;
  }

  // 판 화면: 탁자 + 옆 칸(원정 줄·할 일·연대기)
  function boardSkeleton() {
    if ($("board")) return;
    $("main").innerHTML = `<div class="board" id="board">
      <div class="stage-wrap" id="stageWrap"></div>
      <aside class="side"><div class="panel qt" id="qtrack"></div><section class="panel dock" id="dock"></section><section class="panel chron" id="chron"></section></aside></div>`;
  }
  function renderBoard() {
    const g = G();
    boardSkeleton();
    renderStage();
    // 원정 줄
    const n = N(), meta = [];
    if (g.step !== "reveal") meta.push(rejectsHTML(g.rejects));
    if (g.lady && g.step !== "assassin") meta.push(`<span class="ladytag"><img src="${img("lantern")}" alt="">${T.lamp} · ${esc(nameOf(g.lady.holder))}</span>`);
    if (S.cfg.timer && g.step === "team") meta.push(UI.timer ? `<span id="timer" class="timer run"></span>` : `<button class="btn sm" data-act="timer">⏱ 토론 ${S.cfg.timer / 60}분</button>`);
    $("qtrack").innerHTML = `<div class="qt-row">${SIZES[n].map((sz, r) => questHTML(n, g, r, `${sz}명`)).join("")}</div>${meta.length ? `<div class="qt-meta">${meta.join("")}</div>` : ""}`;
    if (UI.timer) tickTimer();
    renderDock();
    $("chron").innerHTML = `<h3>연대기<small>표는 모두 공개 정보</small></h3>${logHTML()}`;
    UI.voteFlash = false;
  }

  function renderDock() {
    const g = G(), n = N(), need = SIZES[n][g.round], dock = $("dock");
    let act = "", kind = "";
    switch (g.step) {
      case "reveal": {
        const done = g.seen.every(Boolean);
        act = `<div><p class="kicker">역할 확인 · ${g.seen.filter(Boolean).length} / ${n}</p><h3>한 명씩 태블릿을 받아 자기 자리를 누르세요</h3></div>
          <p class="lead">다른 사람은 고개를 돌립니다. 카드는 <b>길게 누르는 동안만</b> 보입니다.</p>
          ${done ? `<p class="lead">첫 ${T.leader}은 <b>${esc(nameOf(g.leader))}</b>${g.lady ? `, ${T.lamp}은 <b>${esc(nameOf(g.lady.holder))}</b>` : ""}입니다.</p>` : ""}
          <button class="btn gold big wide" data-act="begin" ${done ? "" : "disabled"}>${done ? `첫 ${ro(T.unit)}` : "모두 확인하면 시작합니다"}</button>`;
        break;
      }
      case "team":
        act = `<div><p class="kicker">원정대 꾸리기 · ${ORD[g.round]} ${T.unit}</p><h3>${T.leader} ${J(esc(nameOf(g.leader)), "이", "가")} ${need}명을 고릅니다</h3></div>
          <p class="lead">탁자의 자리를 눌러 표식을 놓으세요. 자기 자신도 됩니다. 고르기 전에 충분히 이야기하세요.</p>
          <button class="btn gold big wide" data-act="propose" ${g.team.length === need ? "" : "disabled"}>${g.team.length === need ? "이 원정대로 표결" : `${need - g.team.length}명 더 고르세요`}</button>
          ${g.round === 0 && g.rejects === 0 ? `<p class="tip"><b>첫 ${T.unit}</b>${P(T.unit, "은", "는")} 정보가 거의 없습니다. 고른 이유를 서로 묻고, 표를 눈여겨보세요.</p>` : ""}
          ${g.rejects === 4 ? `<p class="warn">이번에도 부결되면 ${J(SIDE.evil, "이", "가")} 바로 이깁니다.</p>` : ""}`;
        break;
      case "vote":
        if (S.cfg.voteMode === "open") {
          const set = Object.keys(g.votes).length;
          act = `<div><p class="kicker">표결 · 엄지로 동시에</p><h3>하나, 둘, 셋에 모두 엄지를 드세요</h3></div>
            <p class="lead">원정대 <b>${teamNames(g.team)}</b><br>위로 들면 <b>찬성</b>, 아래로 내리면 <b>반대</b>. 자리를 눌러 인장을 찍습니다(한 번 더 누르면 바뀜). 과반이 찬성해야 떠납니다.</p>
            <div class="row"><button class="btn sm" data-act="allyes">나머지 찬성</button><button class="btn sm" data-act="allno">나머지 반대</button><button class="btn sm ghost" data-act="clearvote">다시 적기</button></div>
            <button class="btn gold big wide" data-act="tally" ${set === n ? "" : "disabled"}>${set === n ? "결과 공개" : `${set} / ${n} 기록`}</button>`;
        } else {
          const got = Object.keys(g.votes).length;
          act = `<div><p class="kicker">표결 · 돌려가며 몰래</p><h3>${T.leader}부터 차례로 표를 냅니다</h3></div>
            <p class="lead">원정대 <b>${teamNames(g.team)}</b>. 한 명씩 받아 찬성·반대를 고르면, 모두 낸 뒤 한꺼번에 공개합니다.</p>
            <button class="btn gold big wide" data-act="svote">${got ? `이어서 받기 · ${got} / ${n}` : "표 모으기 시작"}</button>`;
        }
        break;
      case "voteResult": {
        const h = g.history[g.history.length - 1], yes = h.votes.filter(Boolean).length, d = UI.voteFlash ? 600 + n * 150 : 0;
        kind = h.ok ? "" : "evil";
        act = h.ok
          ? `<div class="banner ok after" style="--d:${d}ms">가결 · 찬성 ${yes} : 반대 ${n - yes}<small>원정대 ${teamNames(h.team)}</small></div>
             <button class="btn gold big wide after" style="--d:${d + 200}ms" data-act="aftervote">${T.depart}</button>`
          : `<div class="banner bad after" style="--d:${d}ms">부결 · 찬성 ${yes} : 반대 ${n - yes}<small>${g.rejects >= 5 ? `다섯 번째 부결입니다. ${J(SIDE.evil, "이", "가")} 이깁니다.` : `${T.leader} 자리가 ${esc(nameOf(nextSeat(g.leader)))}에게 넘어갑니다 · 부결 ${g.rejects}/5`}</small></div>
             <button class="btn ${g.rejects >= 5 ? "red" : "gold"} big wide after" style="--d:${d + 200}ms" data-act="aftervote">${g.rejects >= 5 ? "결과 보기" : `${T.mark} 넘기기`}</button>`;
        break;
      }
      case "mission": {
        const got = g.cards.length;
        act = `<div><p class="kicker">${ORD[g.round]} ${T.unit} · 길 위에서</p><h3>원정대가 몰래 카드를 냅니다</h3></div>
          <p class="lead"><b>${teamNames(g.team)}</b> 순서로 태블릿을 넘깁니다. ${SIDE.good} 편은 ${T.cardG}만, ${SIDE.evil} 편은 ${J(T.cardG, "과", "와")} ${T.cardB} 중 하나를 냅니다.</p>
          <button class="btn gold big wide" data-act="mission">${got ? `이어서 받기 · ${got} / ${g.team.length}` : `${esc(nameOf(g.team[0]))}부터 시작`}</button>`;
        break;
      }
      case "missionReveal":
        act = `<div><p class="kicker">${ORD[g.round]} ${T.unit} 결과</p><h3>모두 함께 카드를 뒤집습니다</h3></div>`;
        break;
      case "lady": {
        const L = g.lady; kind = "lady";
        act = `<div><p class="kicker">${T.lamp}</p><h3>${J(esc(nameOf(L.holder)), "이", "가")} 한 사람의 편을 살펴봅니다</h3></div>
          <p class="lead">탁자에서 한 명을 고르세요. 전에 ${J(T.lamp, "을", "를")} 가졌던 사람은 고를 수 없습니다. 본 결과는 말해도 되고, 거짓말을 해도 됩니다.</p>
          ${L.pick == null ? "" : `<div class="banner lady">${J(esc(nameOf(L.pick)), "을", "를")} 살펴볼까요?<small>살펴본 뒤 ${J(T.lamp, "은", "는")} ${esc(nameOf(L.pick))}에게 넘어갑니다</small></div>`}
          <button class="btn gold big wide" data-act="ladygo" ${L.pick == null ? "disabled" : ""}>${L.pick == null ? "살펴볼 사람을 누르세요" : "몰래 살펴보기"}</button>`;
        break;
      }
      case "assassin": {
        const ai = g.players.findIndex(p => p.role === "assassin"); kind = "evil";
        const evils = g.players.map((_, i) => i).filter(i => sideOf(i) === "evil");
        const Sn = ROLES.star.name, A = ROLES.assassin.name;
        act = `<div><p class="kicker">마지막 지목</p><h3>${J(esc(nameOf(ai)), "이", "가")} ${J(Sn, "을", "를")} 지목합니다</h3></div>
          <p class="lead">${SIDE.evil} 편 <b>${teamNames(evils)}</b>. 함께 의논한 뒤 ${J(A, "이", "가")} ${Sn}${P(Sn, "이라고", "라고")} 생각하는 한 명을 탁자에서 누릅니다. 맞히면 ${SIDE.evil}의 역전승입니다.</p>
          ${g.target == null ? "" : `<div class="banner bad">${J(esc(nameOf(g.target)), "을", "를")} ${ro(Sn)} 지목할까요?<small>되돌릴 수 없습니다</small></div>`}
          <button class="btn red big wide" data-act="kill" ${g.target == null ? "disabled" : ""}>${g.target == null ? `${Sn}${P(Sn, "이라", "라")} 생각하는 사람을 누르세요` : "지목하기"}</button>`;
        break;
      }
    }
    dock.className = `panel dock ${kind}`;
    dock.innerHTML = act;
  }

  function faceHTML(c) {
    return c === "ok"
      ? `<div class="face ok"><img src="${img("q_ok")}" alt=""><span class="lab">${T.cardG}</span></div>`
      : `<div class="face fail"><img src="${img("q_fail")}" alt=""><span class="lab">${T.cardB}</span></div>`;
  }

  function renderEnd() {
    const g = G(), good = g.winner === "good";
    const star = g.players.findIndex(p => p.role === "star");
    const cast = g.players.map((p, i) => `<div class="chip ${ROLES[p.role].side} ${i === g.target ? "mark" : ""}" style="--d:${600 + i * 140}ms"><img src="${img(p.art)}" alt=""><span class="cap">${esc(p.name)}<small>${ROLES[p.role].name} · ${SIDE[ROLES[p.role].side]}</small></span></div>`).join("");
    const recap = g.quests.map((q, r) => `<div class="q"><img src="${img(q ? (q.result === "ok" ? "sh_ok" : "sh_fail") : "sh_empty")}" alt="" style="${q ? "" : "opacity:.35"}"><b>${ORD[r]}</b>${q ? `${q.team.map(i => esc(nameOf(i))).join(", ")}${q.fails ? `<br><span class="tag-no">${T.cardB} ${q.fails}</span>` : ""}` : "—"}</div>`).join("");
    $("main").innerHTML = `
      <section class="stack">
        <div class="end-hero"><img src="${img(good ? "win" : "lose")}" alt="">
          <div class="txt"><p class="verdict ${good ? "ok" : "fail"}">${good ? T.winG : T.winE}</p>
          <h3 style="font-family:var(--f-head);font-size:20px">${good ? SIDE.good : SIDE.evil}의 승리</h3>
          <p class="lead">${esc(g.reason)}</p></div></div>
        <div class="panel stack"><h3>모두의 정체</h3><div class="cast">${cast}</div>
          ${g.target != null ? `<p class="note">붉은 테두리가 ${J(ROLES.assassin.name, "이", "가")} 지목한 사람입니다. ${J(ROLES.star.name, "은", "는")} ${esc(nameOf(star))}.</p>` : ""}</div>
        <div class="panel stack"><h3>원정 기록</h3><div class="recap">${recap}</div></div>
        <div class="grid2"><div class="panel chron"><h3>연대기</h3>${logHTML()}</div>
          <div class="panel stack"><h3>한 판 더</h3><p class="lead">같은 사람, 같은 구성으로 역할만 새로 나눕니다.</p>
            <div class="row"><button class="btn gold big" data-act="again">같은 사람들로 다시</button><button class="btn" data-act="tosetup">설정 바꾸기</button></div></div></div>
        ${legalHTML()}
      </section>`;
  }

  // ───────── 가림막 ─────────
  function coverHTML(i, kicker, step) {
    return `<div class="ov-in">
      <p class="kicker">${kicker}</p>
      ${step || ""}
      <img class="ov-back" src="${img("back")}" alt="">
      <h2>${esc(nameOf(i))}의 차례</h2>
      <p class="lead">태블릿을 <b>${esc(nameOf(i))}</b>에게 넘겨 주세요. 다른 사람은 화면에서 눈을 돌립니다.</p>
      <button class="btn gold big" data-act="ov-open">제가 ${esc(nameOf(i))}입니다</button>
    </div>`;
  }
  function dots(total, done) { let s = ""; for (let k = 0; k < total; k++) s += `<i class="${k < done ? "done" : ""}"></i>`; return `<div class="dots">${s}</div>`; }
  function voteQueue() { const g = G(), q = []; for (let k = 0; k < N(); k++) q.push((g.leader + k) % N()); return q; }

  function roleFace(i) {
    const g = G(), p = g.players[i], R = ROLES[p.role], kn = knowledge(i);
    return `<div class="rolecard ${R.side}">
      <figure><img src="${img(p.art)}" alt=""></figure>
      <div><p class="rc-who">${J(esc(p.name), "은", "는")}</p><p class="rc-role">${R.name}</p><span class="rc-side">${SIDE[R.side]} 편</span>
      <p class="rc-goal">${R.side === "good" ? T.goalG : T.goalE}</p>
      <p class="note">${R.blurb}</p>
      <div class="know"><h4>${kn.h}</h4><p class="names-list">${kn.body}</p><p class="sub">${kn.sub}</p></div>
      <p class="tip" style="margin-top:10px"><b>요령</b> ${R.tip}</p></div>
    </div>`;
  }

  function renderOv() {
    const ov = $("ov"), o = UI.ov;
    ov.classList.remove("rv", "tense");
    if (!o && S.phase === "game" && G().step === "missionReveal") {
      ov.classList.add("rv");
      const g = G(), key = `reveal${g.round}`;
      const cur = ov.querySelector(".ov-in[data-key]");
      ov.hidden = false; document.body.style.overflow = "hidden";
      if (cur && cur.dataset.key === key) return;   // 공개 중에는 순서대로 움직이는 중이라 다시 그리지 않는다
      ov.innerHTML = revealHTML(); UI.lastOvKey = key; return;
    }
    if (!o) { ov.hidden = true; ov.innerHTML = ""; document.body.style.overflow = ""; UI.lastOvKey = null; return; }
    ov.hidden = false; document.body.style.overflow = "hidden";
    const ovKey = `${o.k}|${o.open ? 1 : 0}|${o.who ?? ""}|${o.k === "svote" ? Object.keys(G()?.votes || {}).length : o.k === "mission" ? G().cards.length : ""}`;
    const same = ovKey === UI.lastOvKey; UI.lastOvKey = ovKey;
    const g = G();
    let h = "";
    if (o.k === "rules") h = rulesHTML();
    else if (o.k === "quit") h = `<div class="ov-in"><h2>처음으로 돌아갈까요?</h2><p class="lead">지금 판은 사라집니다. 적어 둔 이름과 설정은 남습니다.</p>
        <div class="row" style="justify-content:center"><button class="btn" data-act="ov-x">계속하기</button><button class="btn red" data-act="quit-yes">판 접기</button></div></div>`;
    else if (o.k === "pick") h = `<div class="ov-in"><p class="kicker">내 역할 다시 보기</p><h2>누구인가요?</h2>
        <div class="reveal-grid" style="width:100%">${g.players.map((p, i) => `<button class="rtile" data-act="role" data-i="${i}"><img src="${img("back")}" alt=""><span class="nm">${esc(p.name)}</span></button>`).join("")}</div>
        <button class="btn" data-act="ov-x">닫기</button></div>`;
    else if (o.k === "role") {
      if (!o.open) h = coverHTML(o.who, "역할 확인");
      else h = `<div class="ov-in"><p class="kicker">${esc(nameOf(o.who))}의 역할</p>
          <div class="hold" id="hold" data-hold><div class="cover"><img src="${img("back")}" alt=""><p class="press">길게 누르고 있으면 보여요<small>손을 떼면 다시 가려집니다</small></p></div><div class="face">${roleFace(o.who)}</div></div>
          <button class="btn gold big" data-act="role-done" ${o.held ? "" : "disabled"}>다 봤어요 · 가리기</button></div>`;
    } else if (o.k === "svote") {
      const q = voteQueue(), pos = Object.keys(g.votes).length;
      if (pos >= q.length) h = `<div class="ov-in"><p class="kicker">표결</p>${dots(q.length, pos)}<h2>모두 냈습니다</h2><p class="lead">태블릿을 가운데에 두고 함께 보세요.</p><button class="btn gold big" data-act="sv-reveal">한꺼번에 공개</button></div>`;
      else if (!o.open) h = coverHTML(q[pos], `표결 · 원정대 ${teamNames(g.team)}`, dots(q.length, pos));
      else h = `<div class="ov-in"><p class="kicker">${esc(nameOf(q[pos]))}의 표</p><h2>이 원정대를 보낼까요?</h2>
          <p class="lead">원정대 <b>${teamNames(g.team)}</b> · ${T.leader} ${esc(nameOf(g.leader))}</p>
          <div class="votebig"><button class="y" data-act="sv" data-v="1"><img src="${img("seal_yes")}" alt=""><span class="t">찬성</span><small>보낸다</small></button><button class="n" data-act="sv" data-v="0"><img src="${img("seal_no")}" alt=""><span class="t">반대</span><small>막는다</small></button></div></div>`;
    } else if (o.k === "mission") {
      const pos = g.cards.length, who = g.team[pos];
      if (!o.open) h = coverHTML(who, `${ORD[g.round]} ${T.unit}`, dots(g.team.length, pos));
      else {
        const good = sideOf(who) === "good";
        const btn = c => `<button class="mcard static" data-act="card" data-v="${c}" ${good && c === "fail" ? "disabled" : ""} aria-label="${c === "ok" ? T.cardG : T.cardB}">${faceHTML(c)}${good && c === "fail" ? `<span class="dis">${SIDE.good} 편은<br>${T.cardG}만</span>` : ""}</button>`;
        h = `<div class="ov-in"><p class="kicker">${esc(nameOf(who))}의 카드</p><h2>무엇을 낼까요?</h2>
          <p class="lead">고르면 뒤집혀 섞여 들어가고 화면이 가려집니다.</p>
          <div class="cards">${o.order.map(btn).join("")}</div></div>`;
      }
    } else if (o.k === "lady") {
      const L = g.lady;
      if (!o.open) h = coverHTML(L.holder, T.lamp);
      else {
        const side = sideOf(L.pick);
        h = `<div class="ov-in"><p class="kicker">${T.lamp} · ${esc(nameOf(L.holder))}만 보세요</p>
          <div class="hold" id="hold" data-hold><div class="cover"><div class="ripple"><img src="${img("lantern")}" alt=""></div><p class="press" style="color:var(--teal)">길게 누르고 있으면 ${T.lampSee}<small>${esc(nameOf(L.pick))}의 편이 보입니다</small></p></div>
          <div class="face"><div class="loyal"><img src="${img(side === "good" ? "sh_ok" : "sh_fail")}" alt=""><h2>${esc(nameOf(L.pick))}</h2><p class="verdict ${side === "good" ? "ok" : "fail"}">${SIDE[side]} 편</p></div></div></div>
          <button class="btn gold big" data-act="lady-done" ${o.held ? "" : "disabled"}>다 봤어요 · 가리기</button></div>`;
      }
    }
    ov.innerHTML = h;
    if (same && ov.firstElementChild) ov.firstElementChild.classList.add("still"); else ov.scrollTop = 0;
    bindHold();
  }

  // 길게 눌러 보기
  function bindHold() {
    const el = document.getElementById("hold"); if (!el) return;
    let t0 = 0;
    const on = e => { e.preventDefault(); el.classList.add("on"); t0 = Date.now(); };
    const off = () => {
      if (!el.classList.contains("on")) return;
      el.classList.remove("on");
      if (Date.now() - t0 > 350 && UI.ov && !UI.ov.held) { UI.ov.held = true; const b = document.querySelector('[data-act="role-done"],[data-act="lady-done"]'); if (b) b.disabled = false; }
    };
    el.addEventListener("pointerdown", on);
    ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, off));
    el.addEventListener("contextmenu", e => e.preventDefault());
    el.tabIndex = 0;
    el.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { if (!e.repeat) on(e); } });
    el.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") off(); });
  }

  function revealHTML() {
    const g = G(), p = g.pending, settled = !!g.quests[g.round], ok = p.result === "ok";
    const a = p.cards.slice(0, g.flipped).filter(x => x === "ok").length, f = g.flipped - a;
    const cards = p.cards.map((c, k) => `<div class="mcard ${k < g.flipped ? "open" : ""}"><div class="back" style="background-image:url(${img("back")})"></div>${faceHTML(c)}</div>`).join("");
    return `<div class="rv-bg ${settled ? "on" : ""}" style="background-image:url(${img(ok ? "ret_ok" : "ret_fail")})"></div>
      <div class="ov-in rv" data-key="reveal${g.round}" data-settled="${settled}">
      <p class="kicker">${ORD[g.round]} ${T.unit} · 원정대 ${teamNames(p.team)}</p>
      <div class="rv-head">${settled ? `<p class="vstamp ${ok ? "ok" : "fail"}" style="animation:none">${ok ? T.okV : T.failV}</p>` : `<h2>섞인 카드 ${p.cards.length}장</h2>`}</div>
      <div class="cards">${cards}</div>
      <div class="rv-tally"><span class="a">${T.cardG} <b>${a}</b></span><span class="f">${T.cardB} <b>${f}</b></span></div>
      <p class="lead rv-note">${settled ? (ok ? `${T.okV}.` : `${T.cardB} ${p.fails}장.`) : p.need === 2 ? `이번 ${J(T.unit, "은", "는")} ${T.cardB} 2장이 나와야 ${T.dV}` : `${J(T.cardB, "이", "가")} 한 장이라도 섞이면 ${T.dV}`}</p>
      <div class="rv-act">${settled ? nextBtnHTML() : `<button class="btn gold big" data-act="flip">${g.flipped ? "이어서 공개" : "카드 공개"}</button>`}</div>
      <p class="rv-hint" hidden>화면을 누르면 빨리 넘깁니다</p>
    </div>`;
  }

  function legalHTML() {
    return `<footer class="legal"><p>비공식·비영리 팬 프로젝트입니다. 『레지스탕스: 아발론』(Indie Boards &amp; Cards)의 진행 방식을 바탕으로 했고, 이름·인물·그림은 새로 만들었습니다(그림은 Gemini로 생성).<br>
      권리자께서 문제를 알려 주시면 바로 내리겠습니다. 문의 <a href="mailto:gyolno2@naver.com">gyolno2@naver.com</a></p></footer>`;
  }

  function rulesHTML() {
    const n = S.phase === "game" ? N() : S.cfg.n;
    const sizes = [5, 6, 7, 8, 9, 10].map(k => `<tr><td>${k}명</td><td>${SPLIT[k][0]} : ${SPLIT[k][1]}</td>${SIZES[k].map((s, r) => `<td>${s}${needTwo(k, r) ? "*" : ""}</td>`).join("")}</tr>`).join("");
    const codex = Object.entries(ROLES).map(([k, R]) => `<div class="ent"><img src="${img(R.art[0])}" alt=""><div><div class="nm">${R.name} <span class="note">${SIDE[R.side]}</span></div><div class="ds">${R.blurb}</div></div></div>`).join("");
    return `<div class="ov-in" style="width:min(100%,900px)"><button class="btn sm ov-close" data-act="ov-x">닫기</button>
      <h2>${T.title} 놀이법</h2>
      <div class="rules">
        <div><h3>이야기</h3><p>${T.story}</p></div>
        <div><h3>준비</h3><p>태블릿 하나를 가운데 둡니다. 한 명씩 받아 탁자에서 자기 자리를 누르고, 역할을 <b>길게 눌러</b> 확인합니다. ${J(ROLES.star.name, "은", "는")} ${SIDE.evil} 편을, ${SIDE.evil} 편은 서로를 압니다.</p></div>
        <div><h3>한 차례</h3><ol>
          <li><b>원정대 꾸리기</b> — ${J(T.mark, "을", "를")} 가진 ${J(T.leader, "이", "가")} 정해진 인원만큼 원정대를 고릅니다. 자기 자신도 됩니다.</li>
          <li><b>표결</b> — 모두 동시에 찬성 또는 반대. 과반이 찬성이면 떠나고, 동수는 부결입니다. 부결되면 ${J(T.mark, "이", "가")} 옆 사람에게 넘어갑니다. 한 ${T.unit}에서 <b>다섯 번 연달아</b> 부결되면 ${J(SIDE.evil, "이", "가")} 이깁니다.</li>
          <li><b>원정</b> — 원정대원만 태블릿을 돌려 몰래 <b>${T.cardG}</b>${P(T.cardG, "이나", "나")} <b>${T.cardB}</b>${P(T.cardB, "을", "를")} 냅니다. ${SIDE.good} 편은 ${T.cardG}만 낼 수 있습니다.</li>
          <li><b>결과</b> — 카드를 섞어 한 장씩 뒤집습니다. ${J(T.cardB, "이", "가")} 한 장이라도 있으면 ${T.failShort}. 7명 이상이면 넷째 ${T.unit}만 ${T.cardB} 2장이 필요합니다.</li>
          <li>결과와 관계없이 ${J(T.mark, "은", "는")} 옆 사람에게 넘어갑니다.</li></ol></div>
        <div><h3>끝</h3><ul><li>${T.unit} 셋이 ${T.dIf} ${SIDE.evil} 승리.</li><li>${T.lit3If} ${SIDE.evil} 편이 정체를 밝히고, ${J(ROLES.assassin.name, "이", "가")} ${J(ROLES.star.name, "을", "를")} 한 번 지목합니다. 맞히면 ${SIDE.evil}의 역전승, 틀리면 ${SIDE.good} 승리.</li></ul></div>
        <div><h3>${T.lamp} (선택 규칙)</h3><p>판이 시작될 때 첫 ${T.leader}의 오른쪽 사람이 갖습니다. 둘째·셋째·넷째 ${T.unit}${P(T.unit, "이", "가")} 끝난 뒤, 가진 사람이 한 명을 골라 그 사람의 편(${SIDE.good}/${SIDE.evil})을 몰래 봅니다. 그러면 ${J(T.lamp, "은", "는")} 그 사람에게 넘어가고, 전에 가졌던 사람은 다시 고를 수 없습니다. 본 것을 말할지, 거짓말할지는 자유입니다.</p></div>
        <div><h3>편리한 기능</h3><ul><li><b>↶ 되돌리기</b> — 원정대 고르기·표 기록을 잘못 눌렀을 때 한 단계씩 되돌립니다. 몰래 낸 카드는 되돌릴 수 없습니다.</li><li><b>내 역할</b> — 판 중에 언제든 자기 카드를 다시 볼 수 있습니다.</li><li>출정·결과 공개 같은 장면은 화면을 누르면 빨리 넘어갑니다.</li><li>판이 진행 중이면 화면이 꺼지지 않고, 새로고침해도 이어집니다.</li></ul></div>
        <div><h3>인원과 원정대 크기</h3><div class="tbl"><table><thead><tr><th>인원</th><th>${SIDE.good} : ${SIDE.evil}</th>${ORD.map(o => `<th>${o}</th>`).join("")}</tr></thead><tbody>${sizes}</tbody></table></div>
          <p class="note">* ${T.cardB} 2장이어야 ${T.dRel} ${T.unit}. 지금 설정은 ${n}명입니다.</p></div>
        <div><h3>역할</h3><div class="codex">${codex}</div></div>
        ${legalHTML()}
      </div><button class="btn gold" data-act="ov-x">알겠어요</button></div>`;
  }

  function render() {
    renderTop(); renderQuests();
    if (S.phase === "setup") renderSetup();
    else if (G().step === "end") renderEnd();
    else renderBoard();
    renderOv();
  }
  function commit() { save(); render(); }

  // ───────── 손 ─────────
  document.addEventListener("click", e => {
    // 결과 공개 중 화면을 누르면 빨리 넘긴다
    if (UI.revealing && e.target.closest("#ov")) { UI.fast = true; return; }
    const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    if (UI.busy && !["sound", "rules", "ov-x"].includes(b.dataset.act)) return;
    const a = b.dataset.act, i = b.dataset.i != null ? +b.dataset.i : null, g = S.g;
    switch (a) {
      case "n-": case "n+": {
        const n = Math.min(10, Math.max(5, S.cfg.n + (a === "n+" ? 1 : -1)));
        if (n !== S.cfg.n) { S.cfg.n = n; S.cfg.opts = defaultOpts(n); S.cfg.lady = n >= 7; commit(); }
        break;
      }
      case "opt": S.cfg.opts[b.dataset.k] = !S.cfg.opts[b.dataset.k]; commit(); break;
      case "lady": S.cfg.lady = !S.cfg.lady; commit(); break;
      case "vmode": S.cfg.voteMode = b.dataset.v; commit(); break;
      case "theme": if (S.phase !== "setup") break; S.cfg.theme = b.dataset.v; applyTheme(S.cfg.theme); commit(); break;
      case "tmode": S.cfg.timer = +b.dataset.v; commit(); break;
      case "start": startGame(); break;
      case "sound": pref.sound = !pref.sound; savePref(); renderTop(); if (pref.sound) SFX.tap(); break;
      case "undo": undo(); break;
      case "timer": startTimer(); renderBoard(); break;
      case "rules": UI.ov = { k: "rules" }; renderOv(); break;
      case "quit": UI.ov = { k: "quit" }; renderOv(); break;
      case "quit-yes": S = fresh(S.cfg); UI.ov = null; stopTimer(); keepAwake(false); commit(); break;
      case "ov-x": UI.ov = null; renderOv(); break;
      case "recheck": UI.ov = { k: "pick" }; renderOv(); break;
      case "role": UI.ov = { k: "role", who: i, open: false }; renderOv(); break;
      case "ov-open": UI.ov.open = true; if (UI.ov.k === "mission") UI.ov.order = ["ok", "fail"]; renderOv(); break;
      case "role-done": g.seen[UI.ov.who] = true; UI.ov = null; commit(); break;
      case "begin": beginRounds(); break;
      case "pick": {
        const need = SIZES[N()][g.round], at = g.team.indexOf(i);
        if (at >= 0) { g.team.splice(at, 1); SFX.tap(); }
        else if (g.team.length < need) { g.team.push(i); SFX.place(); }
        else { toast(`원정대는 ${need}명입니다. 먼저 한 명을 빼세요`); shake($("stage")); break; }
        commit(); break;
      }
      case "propose": proposeDone(); break;
      case "tvote": g.votes[i] = g.votes[i] === true ? false : true; SFX.seal(g.votes[i]); commit(); break;
      case "allyes": g.players.forEach((_, k) => { if (g.votes[k] == null) g.votes[k] = true; }); SFX.seal(true); commit(); break;
      case "allno": g.players.forEach((_, k) => { if (g.votes[k] == null) g.votes[k] = false; }); SFX.seal(false); commit(); break;
      case "clearvote": g.votes = {}; commit(); break;
      case "tally": resolveVote(); break;
      case "svote": UI.ov = { k: "svote", open: false }; renderOv(); break;
      case "sv": {
        const box = b.closest(".votebig"); if (box.classList.contains("chosen")) break;
        box.classList.add("chosen"); b.classList.add("go"); SFX.seal(b.dataset.v === "1");
        setTimeout(() => { const q = voteQueue(), pos = Object.keys(g.votes).length; g.votes[q[pos]] = b.dataset.v === "1"; UI.ov.open = false; save(); render(); }, 380);
        break;
      }
      case "sv-reveal": UI.ov = null; resolveVote(); break;
      case "aftervote": afterVote(); break;
      case "mission": UI.ov = { k: "mission", open: false }; renderOv(); break;
      case "card": {
        const box = b.closest(".cards"); if (box.classList.contains("chosen")) break;
        box.classList.add("chosen"); b.classList.add("go"); SFX.flip();
        setTimeout(() => { UI.ov.open = false; submitCard(b.dataset.v); SFX.place(); }, 560);
        break;
      }
      case "flip": runReveal(); break;
      case "aftermission": afterMission(); break;
      case "ladypick": g.lady.pick = i; SFX.tap(); commit(); break;
      case "ladygo": UI.ov = { k: "lady", open: false }; renderOv(); break;
      case "lady-done": SFX.lady(); ladyDone(); break;
      case "target": g.target = i; SFX.beat(0, .3); commit(); break;
      case "kill": assassinate(); break;
      case "again": { const cfg = S.cfg; S = fresh(cfg); startGame(); break; }
      case "tosetup": S = fresh(S.cfg); commit(); break;
    }
  });
  document.addEventListener("input", e => {
    const t = e.target; if (t.dataset?.name == null) return;
    S.cfg.names[+t.dataset.name] = t.value; save();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && UI.ov && ["rules", "pick", "quit"].includes(UI.ov.k)) { UI.ov = null; renderOv(); }
    if (e.key === "Enter" && e.target.dataset?.name != null) { const nx = document.getElementById(`name-${+e.target.dataset.name + 1}`); if (nx) { e.preventDefault(); nx.focus(); } }
  });

  function start() {
    S = load() || fresh();
    if (!S.cfg) S = fresh();
    S.cfg = freshCfg(S.cfg); S.undo = S.undo || [];
    applyTheme(S.cfg.theme);
    if (S.g && S.g.step === "missionReveal" && !S.g.quests[S.g.round] && S.g.flipped >= (S.g.pending?.cards.length || 0)) S.g.quests[S.g.round] = S.g.pending;
    render();
    if (S.phase === "game" && G().step !== "end") keepAwake(true);
    // 그림 미리 받기 — 장면이 처음 열릴 때 빈 칸이 안 보이게
    setTimeout(() => ["back", "q_ok", "q_fail", "seal_yes", "seal_no", "sh_ok", "sh_fail", "sh_empty", "lantern", "win", "lose", "token", "crown", "depart", "ret_ok", "ret_fail", ...Object.values(ROLES).flatMap(r => r.art)].forEach(k => { const im = new Image(); im.src = img(k); }), 600);
  }
  window.__rt = { get S() { return S; }, get UI() { return UI; }, render, commit, speed: v => { UI.speed = v; } };
  start();
})();
</script>
<script>
(function () {
  var APP = "res-avalon";

  // 게임마다 따로 세어지게 이름을 미리 정해 둔다
  window.goatcounter = { path: APP };
  var sc = document.createElement("script");
  sc.async = true;
  sc.src = "https://gc.zgo.at/count.js";
  sc.setAttribute("data-goatcounter", "https://41ways.goatcounter.com/count");
  document.head.appendChild(sc);

  // 판 수·인원·걸린 시간 — 게임 코드에서 norara.ev("start", { n: 인원 }) 처럼 부른다.
  // 지금 누가 있나 — 화면이 보이는 동안 1분에 한 번 "여기 있음"을 보낸다. 탭마다 무작위 번호 하나뿐, 개인을 가려낼 정보는 없다.
  var sid = (function () {
    try {
      var s = sessionStorage.getItem("norara.sid");
      if (!s) { s = Math.random().toString(36).slice(2, 12) + Date.now().toString(36); sessionStorage.setItem("norara.sid", s); }
      return s;
    } catch (e) { return Math.random().toString(36).slice(2, 14); }
  })();
  var playing = false;
  function beat(st) {
    try {
      navigator.sendBeacon("https://norara-errors.41ways.workers.dev/beat",
        JSON.stringify({ app: APP, sid: sid, st: st || (playing ? "play" : "look") }));
    } catch (e) {}
  }

  window.norara = {
    ev: function (name, o) {
      o = o || {};
      o.app = APP;
      o.ev = name;
      try {
        navigator.sendBeacon("https://norara-errors.41ways.workers.dev/ev", JSON.stringify(o));
      } catch (e) {}
      if (name === "start") window.norara.live(true);
      if (name === "end") window.norara.live(false);
    },
    live: function (on) {
      on = !!on;
      if (on === playing) return;
      playing = on;
      if (document.visibilityState === "visible") beat();
    }
  };

  setTimeout(function () { if (document.visibilityState === "visible") beat(); }, 2000);
  setInterval(function () { if (document.visibilityState === "visible") beat(); }, 60000);
  document.addEventListener("visibilitychange", function () {
    beat(document.visibilityState === "hidden" ? "gone" : null);
  });
  addEventListener("pagehide", function () { beat("gone"); });

  // 얼마나 머물렀는지 — 탭을 덮거나 닫을 때 한 번만
  var came = Date.now(), told = false;
  function leaving() {
    if (told) return;
    told = true;
    var sec = Math.round((Date.now() - came) / 1000);
    if (sec >= 5) window.norara.ev("visit", { sec: sec });
  }
  addEventListener("pagehide", leaving);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") leaving();
  });

  // 화면에서 터진 오류를 모은다. 한 번 열 때 다섯 건까지만
  var left = 5;
  function send(o) {
    if (left-- <= 0) return;
    o.app = APP;
    o.page = location.pathname + location.search;
    try {
      navigator.sendBeacon("https://norara-errors.41ways.workers.dev/report", JSON.stringify(o));
    } catch (e) {}
  }
  addEventListener("error", function (e) {
    if (!e.message) return;
    send({ msg: e.message, src: e.filename, line: e.lineno, col: e.colno,
           stack: e.error && e.error.stack });
  });
  addEventListener("unhandledrejection", function (e) {
    var r = e.reason;
    send({ msg: "처리되지 않은 거절: " + ((r && r.message) || r), stack: r && r.stack });
  });
})();
</script>
</body>
</html>
