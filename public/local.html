<!doctype html>
<html lang="ko">
<head>

<meta property="og:title" content="Resistance:AVALON — 한 기기로">
<meta property="og:description" content="태블릿 하나로 5~10명이 하는 숨은 역할 게임. 비공식 팬 프로젝트.">
<meta property="og:image" content="https://res-avalon-fanproj.41ways.workers.dev/art/og.jpg">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=East+Sea+Dokdo&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&family=Song+Myung&display=swap">
<style>
/* 밤의 탁자. 판 중에는 가운데 둥근 탁자(위에서 내려다본 모습)에 모두가 둘러앉고, 옆 칸에 원정 기록·할 일·연대기.
   눈에 보이는 상호작용: 대장 표식(왕관·횃불)이 탁자를 따라 옮겨 가고, 원정대 표식이 놓이고, 인장이 차례로 찍히고, 출정·결과 공개는 장면 연출 */
:root {
  color-scheme: dark;
  --bg: #0b1124;
  --bg-2: #121a36;
  --ink: #eef1fb;
  --dim: #9aa6c8;
  --line: rgba(238, 241, 251, .12);
  --panel: rgba(13, 19, 40, .72);
  --gold: #f2c76b;
  --gold-hi: #ffe2a0;
  --gold-deep: #9a6a1c;
  --red: #e2566a;
  --red-hi: #ffb3bd;
  --red-deep: #6d1626;
  --teal: #7fd6cf;
  --r: 10px;
  --f-head: "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --ease: cubic-bezier(.6, 0, .3, 1);
  --pop: cubic-bezier(.2, 1.5, .4, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  background: radial-gradient(ellipse 90% 50% at 50% 0%, #1d2a58 0%, transparent 70%), linear-gradient(180deg, var(--bg-2), var(--bg) 60%);
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
}
body.ingame {
  background: radial-gradient(ellipse 70% 60% at 38% 48%, rgba(242, 199, 107, .07), transparent 70%),
    linear-gradient(180deg, rgba(8, 12, 28, .86), rgba(8, 12, 28, .96)), var(--bgimg) center 60% / cover fixed, var(--bg);
}
.wrap { max-width: 1220px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; font-weight: 800; text-wrap: balance; }
p { margin: 0; }
b { color: #fff; }

/* 버튼 */
.btn { border: 1px solid var(--line); background: rgba(255, 255, 255, .06); padding: 11px 16px; border-radius: 6px; font-size: 15px; transition: background .15s, border-color .15s, transform .1s, filter .15s; }
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, .11); border-color: rgba(255, 255, 255, .3); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.gold { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, #d9a443); border-color: var(--gold); color: #2a1a05; font-weight: 700; box-shadow: 0 8px 26px -10px rgba(242, 199, 107, .8), inset 0 1px 0 rgba(255, 255, 255, .6); }
.btn.gold:hover:not(:disabled) { filter: brightness(1.06); }
.btn.gold:not(:disabled)::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .55) 50%, transparent 70%); transform: translateX(-120%); animation: sheen 3.2s 1s infinite; }
@keyframes sheen { 0%, 70% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.btn.red { background: linear-gradient(180deg, #f0727f, var(--red) 55%, #b23246); border-color: var(--red); color: #fff; font-weight: 700; box-shadow: 0 8px 26px -10px rgba(226, 86, 106, .8); }
.btn.big { padding: 15px 26px; font-size: 18px; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 7px 11px; font-size: 13.5px; }

/* 머리 */
.hero { position: relative; overflow: hidden; isolation: isolate; }
.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; z-index: -2; transition: filter 1.2s; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(11, 17, 36, .35) 0%, rgba(11, 17, 36, .15) 40%, rgba(11, 17, 36, .72) 78%, var(--bg) 100%); }
.hero.win .hero-bg { filter: sepia(.35) saturate(1.3) brightness(1.15); }
.hero.lose .hero-bg { filter: grayscale(.4) brightness(.6) sepia(.5) hue-rotate(-30deg) saturate(2); }
.topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
.brand h1 { font-family: var(--f-head); font-size: clamp(46px, 8vw, 78px); line-height: 1; letter-spacing: .05em; text-shadow: 0 2px 18px rgba(0, 0, 0, .6), 0 0 30px rgba(242, 199, 107, .25); }
.brand p { font-family: var(--f-head); font-weight: 700; font-size: clamp(13px, 1.8vw, 16px); letter-spacing: .12em; color: var(--gold-hi); text-shadow: 0 1px 6px #000; margin-top: 4px; }
/* 라틴 제목 로고: 윗줄 RESISTANCE(작게, 넓게), 아랫줄 AVALON(크게). em 이라 h1·장면 제목 크기를 따라간다 */
.wm-pre, .wm-main { display: block; font-family: "Cinzel", var(--f-head); }
.wm-pre { font-weight: 600; font-size: .27em; letter-spacing: .5em; text-transform: uppercase; color: var(--gold-hi); margin: 0 0 .2em .06em; }
.wm-main { font-weight: 700; letter-spacing: inherit; }
.brand .wm-main { letter-spacing: .1em; }
.ingame .brand .wm-pre, .ingame .brand .wm-main { display: inline; }
.ingame .brand .wm-pre { font-size: .42em; letter-spacing: .32em; margin: 0 .5em 0 0; vertical-align: .18em; }
.topnav { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.topnav .btn { background: rgba(11, 17, 36, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.ingame .hero { overflow: visible; }
.ingame .hero-bg, .ingame .hero::after, .ingame #quests { display: none; }
.ingame .topbar { align-items: center; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); padding-bottom: 4px; }
.ingame .brand { display: flex; align-items: baseline; gap: 10px; }
.ingame .brand h1 { font-size: 28px; }
.ingame .brand p { font-size: 12.5px; margin: 0; }

/* 다섯 원정 (설정·끝 화면의 큰 줄) */
.quests { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(4px, 1.6vw, 18px); padding: clamp(18px, 3.4vw, 34px) 0 14px; }
.quest { position: relative; text-align: center; }
.quest .sh { position: relative; width: min(84px, 15vw); aspect-ratio: 26 / 30; margin: 0 auto; }
.quest .sh img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .55)); transition: transform .4s, filter .4s; }
.quest .sh .n { position: absolute; inset: 22% 0 auto; font-family: var(--f-head); font-size: clamp(16px, 3vw, 26px); color: #2b3450; text-shadow: 0 1px 0 rgba(255, 255, 255, .5); }
.quest.ok .sh .n, .quest.fail .sh .n { display: none; }
.quest.future .sh img { filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .55)) brightness(.55) saturate(.6); }
.quest.now .sh img { filter: drop-shadow(0 0 14px rgba(255, 226, 160, .85)) drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); transform: translateY(-4px) scale(1.06); animation: breathe 2.4s ease-in-out infinite; }
.quest.just .sh img { animation: stamp .9s var(--pop); }
.quest .lab { margin-top: 6px; font-size: clamp(11.5px, 1.6vw, 14px); color: var(--dim); line-height: 1.3; text-shadow: 0 1px 4px #000; }
.quest .lab b { display: block; font-family: var(--f-head); font-size: clamp(13px, 1.9vw, 16px); color: var(--ink); }
.quest.now .lab b { color: var(--gold-hi); }
.quest.ok .lab { color: var(--gold); }
.quest.fail .lab { color: var(--red-hi); }
.two { display: inline-block; white-space: nowrap; margin-top: 3px; font-size: 11px; padding: 0 5px; border: 1px solid rgba(226, 86, 106, .6); color: var(--red-hi); border-radius: 3px; }
@keyframes stamp { 0% { transform: scale(.4) rotate(-10deg); opacity: 0; } 60% { transform: scale(1.18) rotate(3deg); opacity: 1; } 100% { transform: none; } }
@keyframes breathe { 50% { filter: drop-shadow(0 0 22px rgba(255, 226, 160, 1)) drop-shadow(0 6px 10px rgba(0, 0, 0, .5)); } }

/* 판: 탁자 + 옆 칸 */
main { position: relative; z-index: 2; padding-block: 18px 40px; }
.ingame main { padding-top: 6px; }
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 390px); gap: 22px; align-items: start; }
.side { display: grid; gap: 14px; position: sticky; top: 12px; }
@media (max-width: 900px) {
  .board { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .side { position: static; display: contents; }
  .board .qt { order: -1; }
}
.stage-wrap { display: grid; justify-items: center; padding-bottom: 8px; }
.stage { position: relative; width: min(100%, max(330px, calc(100svh - 92px))); aspect-ratio: 1; --u: 3.6px; user-select: none; -webkit-user-select: none; }
@media (max-width: 900px) { .stage { width: min(100%, max(330px, calc(100svh - 430px))); } }
.table { position: absolute; left: 14%; top: 14%; width: 72%; height: 72%; border-radius: 50%; background: url(art/common/table.webp?v=r3) center / cover;
  box-shadow: 0 calc(4 * var(--u)) calc(9 * var(--u)) calc(-2 * var(--u)) rgba(0, 0, 0, .85), 0 0 0 calc(.3 * var(--u)) rgba(242, 199, 107, .12), 0 0 calc(14 * var(--u)) calc(-2 * var(--u)) rgba(242, 199, 107, .22); }
.table::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 50%, rgba(255, 200, 120, .10), transparent 45%), radial-gradient(circle at 50% 50%, transparent 55%, rgba(0, 0, 0, .25) 75%); pointer-events: none; }
.stage.dark .table { filter: brightness(.55) saturate(.7) sepia(.3) hue-rotate(-25deg); }
.stage.water .table::after { background: radial-gradient(circle at 50% 50%, rgba(127, 214, 207, .18), transparent 55%); }

/* 탁자 가운데 */
.hub { position: absolute; left: 50%; top: 50%; width: calc(38 * var(--u)); height: calc(38 * var(--u)); transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; text-align: center; pointer-events: none; }
.hub-in { display: grid; justify-items: center; gap: calc(.6 * var(--u)); animation: hubIn .45s ease-out both; }
@keyframes hubIn { from { opacity: 0; transform: scale(.92); } }
.hk { font-family: var(--f-head); font-weight: 700; font-size: max(11px, calc(2.4 * var(--u))); letter-spacing: .2em; color: var(--gold); text-shadow: 0 1px 4px #000; }
.hbig { font-family: var(--f-head); font-weight: 800; font-size: calc(6.4 * var(--u)); line-height: 1.05; color: var(--ink); text-shadow: 0 2px 10px rgba(0, 0, 0, .8); word-break: keep-all; }
.hs { font-size: max(11px, calc(2.2 * var(--u))); color: #c9cfe6; text-shadow: 0 1px 4px #000; max-width: calc(32 * var(--u)); line-height: 1.35; }
.hub .sh { position: relative; width: calc(11 * var(--u)); aspect-ratio: 26 / 30; }
.hub .sh img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 calc(2 * var(--u)) rgba(255, 226, 160, .6)) drop-shadow(0 calc(1 * var(--u)) calc(1.4 * var(--u)) rgba(0, 0, 0, .6)); }
.hub .sh span { position: absolute; inset: 20% 0 auto; font-family: var(--f-head); font-size: calc(4.4 * var(--u)); color: #2b3450; }
.pips { display: flex; gap: calc(1 * var(--u)); justify-content: center; margin-top: calc(.4 * var(--u)); }
.pips i { width: calc(3.4 * var(--u)); height: calc(3.4 * var(--u)); border-radius: 50%; border: calc(.35 * var(--u)) dashed rgba(242, 199, 107, .55); }
.pips i.on { border: 0; background: var(--tok) center / cover; animation: pipIn .35s var(--pop); box-shadow: 0 0 calc(1.4 * var(--u)) rgba(242, 199, 107, .7); }
@keyframes pipIn { from { transform: scale(1.8); opacity: 0; } }
.hub .roundimg { width: calc(20 * var(--u)); height: calc(20 * var(--u)); border-radius: 50%; object-fit: cover; border: calc(.5 * var(--u)) solid var(--teal); box-shadow: 0 0 calc(5 * var(--u)) rgba(127, 214, 207, .55); }
.hub .roundimg.red { border-color: var(--red); box-shadow: 0 0 calc(5 * var(--u)) rgba(226, 86, 106, .6); animation: redPulse 2s ease-in-out infinite; }
@keyframes redPulse { 50% { box-shadow: 0 0 calc(8 * var(--u)) rgba(226, 86, 106, .9); } }
.ripple { position: relative; display: grid; place-items: center; }
.ripple::before, .ripple::after { content: ""; position: absolute; inset: calc(-1 * var(--u)); border-radius: 50%; border: calc(.3 * var(--u)) solid rgba(127, 214, 207, .55); animation: ripple 2.6s ease-out infinite; }
.ripple::after { animation-delay: 1.3s; }
@keyframes ripple { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }
.bigstamp { font-family: var(--f-head); font-weight: 800; font-size: calc(8 * var(--u)); line-height: 1; padding: calc(1.2 * var(--u)) calc(3 * var(--u)); border: calc(.7 * var(--u)) double currentColor; border-radius: calc(1 * var(--u)); transform: rotate(-8deg); background: rgba(8, 12, 26, .55); text-shadow: 0 0 calc(3 * var(--u)) currentColor; }
.bigstamp.ok { color: var(--gold-hi); }
.bigstamp.bad { color: var(--red-hi); }
.bigstamp.slam { animation: slam .55s var(--d, 0ms) cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes slam { 0% { transform: scale(2.6) rotate(-20deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotate(-8deg); opacity: 1; } }
.after { animation: fadeIn .4s var(--d, 0ms) both; }
@keyframes fadeIn { from { opacity: 0; } }
.pile { position: relative; width: calc(10 * var(--u)); height: calc(14 * var(--u)); }
.pile i { position: absolute; inset: 0; border-radius: calc(1 * var(--u)); background: var(--back) center / cover; border: calc(.25 * var(--u)) solid rgba(242, 199, 107, .6); box-shadow: 0 calc(1 * var(--u)) calc(2 * var(--u)) rgba(0, 0, 0, .6); }
.pile i.drop { animation: drop .5s cubic-bezier(.3, 1.3, .5, 1) both; }
@keyframes drop { from { transform: translateY(calc(-14 * var(--u))) rotate(-25deg) scale(1.3); opacity: 0; } }
.pile .slot { border: calc(.3 * var(--u)) dashed rgba(242, 199, 107, .35); background: none; box-shadow: none; }

/* 자리 */
.seat { position: absolute; width: calc(11.5 * var(--u)); height: calc(11.5 * var(--u)); transform: translate(-50%, -50%); padding: 0; border: 0; background: none; border-radius: 50%; touch-action: manipulation; }
.seat:disabled { cursor: default; }
.med { position: absolute; inset: 0; border-radius: 50%; transform-style: preserve-3d; transition: transform .8s var(--ease), scale .15s; }
.med > span { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; }
.med .f { background: radial-gradient(circle at 34% 28%, var(--c1), var(--c2) 72%); border: calc(.55 * var(--u)) solid #c9a45a;
  box-shadow: inset 0 0 0 calc(.35 * var(--u)) rgba(0, 0, 0, .35), inset 0 calc(.6 * var(--u)) calc(1 * var(--u)) rgba(255, 255, 255, .18), 0 calc(1.2 * var(--u)) calc(2.2 * var(--u)) rgba(0, 0, 0, .65);
  font-family: var(--f-head); font-weight: 800; font-size: calc(4.8 * var(--u)); color: #fff3d6; text-shadow: 0 calc(.3 * var(--u)) calc(.6 * var(--u)) rgba(0, 0, 0, .7); transition: border-color .3s, box-shadow .3s, filter .3s; }
.med .b { transform: rotateY(180deg); background: #111 center / cover; border: calc(.55 * var(--u)) solid var(--gold); box-shadow: 0 calc(1.2 * var(--u)) calc(2.2 * var(--u)) rgba(0, 0, 0, .65); }
.seat.evil .med .b { border-color: var(--red); box-shadow: 0 0 calc(3 * var(--u)) rgba(226, 86, 106, .7), 0 calc(1.2 * var(--u)) calc(2.2 * var(--u)) rgba(0, 0, 0, .65); }
.seat.showrole .med { transform: rotateY(180deg); }
.seat .nm { position: absolute; top: calc(100% + calc(.5 * var(--u))); left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: max(11px, calc(2.35 * var(--u))); line-height: 1.4; padding: calc(.1 * var(--u)) calc(1.1 * var(--u)); background: rgba(8, 12, 26, .85); border: 1px solid var(--line); border-radius: 3px; max-width: calc(21 * var(--u)); overflow: hidden; text-overflow: ellipsis; transition: color .3s, border-color .3s, background .3s; }
.seat .rn { display: block; font-size: max(10px, calc(1.9 * var(--u))); color: var(--dim); }
.seat.pickable { cursor: pointer; }
.seat.pickable:hover .med { scale: 1.07; }
.seat.pickable:active .med { scale: .96; }
.seat.pickable .med .f { animation: invite 2.4s ease-in-out infinite; }
@keyframes invite { 50% { box-shadow: inset 0 0 0 calc(.35 * var(--u)) rgba(0, 0, 0, .35), 0 0 0 calc(.6 * var(--u)) rgba(242, 199, 107, .18), 0 calc(1.2 * var(--u)) calc(2.2 * var(--u)) rgba(0, 0, 0, .65); } }
.seat.lead .nm { color: var(--gold-hi); border-color: rgba(242, 199, 107, .6); }
.seat.on .med .f { border-color: var(--gold-hi); animation: none; box-shadow: 0 0 0 calc(.6 * var(--u)) rgba(242, 199, 107, .3), 0 0 calc(4 * var(--u)) rgba(242, 199, 107, .55), 0 calc(1.2 * var(--u)) calc(2.2 * var(--u)) rgba(0, 0, 0, .65); }
.seat.on .nm { background: rgba(80, 56, 14, .92); border-color: var(--gold); color: #fff; }
.seat.yes .med .f { border-color: var(--gold); }
.seat.no .med .f { border-color: var(--red); filter: saturate(.6) brightness(.8); }
.seat.voted .med .f::after { content: "✓"; position: absolute; right: calc(-1 * var(--u)); bottom: calc(-1 * var(--u)); width: calc(4.2 * var(--u)); height: calc(4.2 * var(--u)); display: grid; place-items: center; border-radius: 50%; background: var(--gold); color: #2a1a05; font-family: var(--f-body); font-size: calc(2.6 * var(--u)); box-shadow: 0 calc(.4 * var(--u)) calc(1 * var(--u)) rgba(0, 0, 0, .5); }
.seat.past { opacity: .4; }
.seat.dimmed .med .f { filter: brightness(.45) saturate(.4); }
.seat.target .med { scale: 1.08; }
.seat.target .med .f { border-color: var(--red); box-shadow: 0 0 0 calc(.7 * var(--u)) rgba(226, 86, 106, .35), 0 0 calc(5 * var(--u)) rgba(226, 86, 106, .8); }
.seat.target::before { content: ""; position: absolute; inset: calc(-2.4 * var(--u)); border-radius: 50%; border: calc(.4 * var(--u)) dashed var(--red); animation: spin 5s linear infinite; }
.seat.pick-lady::before { border-color: var(--teal); }
.seat.pick-lady .med .f { border-color: var(--teal); box-shadow: 0 0 0 calc(.7 * var(--u)) rgba(127, 214, 207, .3), 0 0 calc(5 * var(--u)) rgba(127, 214, 207, .7); }
@keyframes spin { to { transform: rotate(360deg); } }
.seat .seal { position: absolute; right: calc(-3.6 * var(--u)); top: calc(-3 * var(--u)); width: calc(8.4 * var(--u)); height: calc(8.4 * var(--u)); object-fit: contain; filter: drop-shadow(0 calc(.6 * var(--u)) calc(.8 * var(--u)) rgba(0, 0, 0, .7)); opacity: 0; transform: scale(.4); transition: opacity .2s, transform .25s var(--pop); pointer-events: none; }
.seat.sv .seal { opacity: 1; transform: none; }
.seat .seal:not([src]) { visibility: hidden; }
.seat.sv.anim .seal { animation: sealIn .45s var(--d) cubic-bezier(.3, 1.5, .5, 1) both; transition: none; }
@keyframes sealIn { 0% { opacity: 0; transform: scale(2.6) rotate(-30deg); } 100% { opacity: 1; transform: none; } }
.seat.anim .med { animation: thump .35s var(--d) ease-out both; }
@keyframes thump { 30% { translate: 0 calc(.8 * var(--u)); } }
.seat .chk { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg); font-family: var(--f-head); font-weight: 800; font-size: calc(2.4 * var(--u)); color: var(--gold-hi); border: calc(.3 * var(--u)) solid var(--gold); padding: 0 calc(.8 * var(--u)); background: rgba(8, 12, 26, .85); border-radius: calc(.6 * var(--u)); opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
.seat.seen .chk { opacity: 1; }
.seat.seen .med .f { filter: brightness(.5) saturate(.5); }
/* 원정대 표식 (탁자 위) */
.tok { position: absolute; width: calc(7 * var(--u)); height: calc(7 * var(--u)); transform: translate(-50%, -50%) scale(1.9); opacity: 0; pointer-events: none; transition: transform .45s cubic-bezier(.3, 1.5, .5, 1), opacity .3s; filter: drop-shadow(0 calc(.8 * var(--u)) calc(1 * var(--u)) rgba(0, 0, 0, .6)); }
.tok.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
/* 탁자를 따라 도는 대장 표식·등불 */
.orbit { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; transition: transform 1s var(--ease), opacity .4s; z-index: 3; }
.orbit .o-item { position: absolute; left: 0; top: 0; transition: transform 1s var(--ease); }
.orbit.off { opacity: 0; }
.crown-tok { width: calc(8 * var(--u)); height: auto; filter: drop-shadow(0 calc(.6 * var(--u)) calc(.8 * var(--u)) rgba(0, 0, 0, .7)) drop-shadow(0 0 calc(1.6 * var(--u)) rgba(242, 199, 107, .55)); }
.lady-tok { width: calc(5.2 * var(--u)); height: calc(5.2 * var(--u)); border-radius: 50%; object-fit: cover; border: calc(.35 * var(--u)) solid var(--teal); box-shadow: 0 0 calc(2 * var(--u)) rgba(127, 214, 207, .7); }
.orbit.bounce .o-item > * { animation: hop .6s .9s ease-out; }
@keyframes hop { 40% { transform: translateY(calc(-1.4 * var(--u))); } }

/* 옆 칸 */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.panel h3 { font-family: var(--f-head); font-size: 20px; margin-bottom: 6px; }
.qt { padding: 14px 14px 12px; }
.qt-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; position: relative; }
.qt-row::before { content: ""; position: absolute; left: 10%; right: 10%; top: 26px; height: 2px; background: linear-gradient(90deg, rgba(242, 199, 107, .1), rgba(242, 199, 107, .45), rgba(242, 199, 107, .1)); }
.qt .quest .sh { width: min(48px, 13vw); }
.qt .quest .sh .n { font-size: 18px; }
.qt .quest .lab { margin-top: 3px; font-size: 11.5px; }
.qt .quest .lab b { font-size: 12.5px; }
.qt-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--dim); }
.rejects { display: flex; align-items: center; gap: 4px; }
.rejects i { width: 12px; height: 12px; border-radius: 2px; border: 1.5px solid rgba(238, 241, 251, .3); display: inline-block; transform: rotate(45deg); margin: 0 2px; transition: background .3s; }
.rejects i.on { background: var(--red); border-color: var(--red); box-shadow: 0 0 8px rgba(226, 86, 106, .7); }
.rejects i.last { border-style: dashed; border-color: var(--red); }
.rejects span { margin-left: 4px; }
.timer { font-variant-numeric: tabular-nums; font-size: 15px; }
.timer.run { color: var(--gold-hi); }
.timer.out { color: var(--red-hi); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
.ladytag { display: inline-flex; align-items: center; gap: 6px; }
.ladytag img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; border: 1px solid var(--teal); }

.dock { border-top: 2px solid rgba(242, 199, 107, .55); display: grid; gap: 12px; }
.dock.evil { border-top-color: var(--red); }
.dock.lady { border-top-color: var(--teal); }
.kicker { font-size: 12.5px; letter-spacing: .14em; color: var(--gold); }
.dock.evil .kicker { color: var(--red-hi); }
.dock.lady .kicker { color: var(--teal); }
.dock h3 { font-family: var(--f-head); font-size: 21px; line-height: 1.3; margin: 2px 0 0; word-break: keep-all; }
.lead { color: var(--dim); font-size: 15px; }
.lead b { color: var(--ink); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: grid; gap: 14px; }
.note { font-size: 13.5px; color: var(--dim); }
.warn { font-size: 13.5px; color: var(--red-hi); }
.tip { font-size: 13.5px; color: var(--dim); border-left: 3px solid var(--gold-deep); padding: 4px 0 4px 10px; }
.tip b { color: var(--gold-hi); }
.names-inline { display: flex; flex-wrap: wrap; gap: 5px; }
.nchip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 3px; border-radius: 4px; background: rgba(255, 255, 255, .06); border: 1px solid var(--line); font-size: 14px; }
.nchip img { width: 18px; height: 18px; }

/* 연대기 */
.chron h3 { display: flex; justify-content: space-between; align-items: baseline; }
.chron h3 small { font-family: var(--f-body); font-weight: 400; font-size: 12.5px; color: var(--dim); }
.log { display: grid; gap: 10px; max-height: 420px; overflow: auto; padding-right: 4px; }
.log-item { position: relative; border-left: 3px solid var(--line); padding: 2px 0 2px 12px; font-size: 13px; color: var(--dim); animation: fadeUp .4s ease-out; }
.log-item.ok { border-color: var(--gold); }
.log-item.bad { border-color: var(--red); }
.log-item.lady { border-color: var(--teal); }
.log-item .t { color: var(--ink); font-size: 13.5px; }
.log-item .t em { font-style: normal; color: var(--dim); font-size: 12px; margin-left: 4px; }
.vrow { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.vc { font-size: 12px; padding: 0 6px; border-radius: 3px; line-height: 1.6; border: 1px solid transparent; }
.vc.y { background: rgba(242, 199, 107, .16); color: var(--gold-hi); }
.vc.n { background: rgba(226, 86, 106, .16); color: var(--red-hi); }
.vc.tm { border-color: rgba(255, 255, 255, .55); }
.res-ok { color: var(--gold-hi); font-weight: 700; }
.res-fail { color: var(--red-hi); font-weight: 700; }
.tag-yes { color: var(--gold-hi); }
.tag-no { color: var(--red-hi); }
.log-empty { color: var(--dim); font-size: 13.5px; }

/* 설정 */
.setup { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 22px; align-items: start; }
@media (max-width: 880px) { .setup { grid-template-columns: minmax(0, 1fr); } }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper output { font-family: var(--f-head); font-size: 42px; min-width: 2.2ch; text-align: center; line-height: 1; }
.stepper .btn { width: 46px; height: 46px; padding: 0; font-size: 22px; }
.split { font-size: 14px; color: var(--dim); }
.split .g { color: var(--gold-hi); } .split .e { color: var(--red-hi); }
.names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.names label { display: flex; align-items: center; gap: 8px; background: rgba(0, 0, 0, .22); border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; }
.names label span { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff3d6; background: radial-gradient(circle at 34% 28%, var(--c1), var(--c2) 72%); border: 1.5px solid #c9a45a; flex: none; }
.names input { flex: 1; min-width: 0; background: none; border: 0; padding: 11px 0; outline: none; }
.names label:focus-within { border-color: var(--gold); }
.comp { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
.chip { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); background: #0d1328; }
.chip img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.chip .cap { position: absolute; inset: auto 0 0; padding: 16px 6px 5px; font-size: 13px; background: linear-gradient(transparent, rgba(5, 8, 16, .94)); font-family: var(--f-head); font-weight: 700; text-align: center; }
.chip .cnt { position: absolute; top: 5px; right: 5px; font-size: 12px; background: rgba(5, 8, 16, .8); padding: 0 6px; border-radius: 3px; }
.chip.good { border-color: rgba(242, 199, 107, .45); }
.chip.evil { border-color: rgba(226, 86, 106, .5); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: rgba(0, 0, 0, .18); text-align: left; width: 100%; }
.opt[aria-pressed="true"] { border-color: rgba(242, 199, 107, .6); background: rgba(242, 199, 107, .08); }
.opt .box { flex: none; width: 20px; height: 20px; border-radius: 4px; border: 1.5px solid var(--dim); margin-top: 2px; display: grid; place-items: center; }
.opt[aria-pressed="true"] .box { background: var(--gold); border-color: var(--gold); }
.opt[aria-pressed="true"] .box::after { content: ""; width: 9px; height: 5px; border: 2px solid #2a1a05; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.opt .t { font-family: var(--f-head); font-weight: 700; font-size: 16px; }
.opt .d { font-size: 13px; color: var(--dim); }
.opt .side-g { color: var(--gold); } .opt .side-e { color: var(--red-hi); } .opt .side-r { color: var(--teal); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 9px 14px; font-size: 14px; color: var(--dim); }
.seg button[aria-pressed="true"] { background: rgba(242, 199, 107, .18); color: var(--ink); }
.sub-h { font-family: var(--f-head); font-weight: 700; font-size: 15px; color: var(--ink); }

.reveal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 12px; }
.rtile { position: relative; padding: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: #0d1328; text-align: center; }
.rtile img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
.rtile .nm { display: block; padding: 8px 6px 10px; font-family: var(--f-head); font-weight: 700; font-size: 17px; }

/* 가림막 */
.ov { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; overflow: auto; overscroll-behavior: contain;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 25%, #1c2852, #060a17 75%); }
.ov-in { position: relative; z-index: 2; width: min(100%, 760px); display: grid; gap: 18px; justify-items: center; text-align: center; animation: fadeUp .35s ease-out; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
.ov-in.still { animation: none; }
.ov-back { width: min(240px, 56vw); aspect-ratio: 1; object-fit: cover; border-radius: 14px; box-shadow: 0 0 0 1px rgba(242, 199, 107, .4), 0 20px 60px -10px rgba(242, 199, 107, .35); }
.ov h2 { font-family: var(--f-head); font-size: clamp(26px, 5vw, 38px); }
.ov .lead { max-width: 34em; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 9px; height: 9px; border-radius: 2px; transform: rotate(45deg); background: var(--line); }
.dots i.done { background: var(--gold); }
.ov-close { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 14px); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 3; }

/* 길게 눌러 보는 카드 */
.hold { position: relative; width: min(100%, 680px); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; display: grid; align-items: center; justify-items: center; }
.hold > .cover, .hold > .face { grid-area: 1 / 1; }
.hold .cover { display: grid; justify-items: center; gap: 12px; padding: 10px; border-radius: 16px; transition: opacity .2s; }
.hold .cover img { width: min(260px, 60vw); aspect-ratio: 1; border-radius: 14px; object-fit: cover; box-shadow: 0 0 0 1px rgba(242, 199, 107, .45), 0 20px 50px -14px rgba(242, 199, 107, .45); }
.hold .cover .press { font-family: var(--f-head); font-weight: 800; font-size: 20px; color: var(--gold-hi); }
.hold .cover .press small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--dim); }
.hold .face { width: 100%; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .15s; display: grid; align-items: center; justify-items: center; }
.hold.on .face { opacity: 1; visibility: visible; }
.hold.on .cover { opacity: 0; }
.hold .cover .ripple img { border-radius: 50%; width: min(220px, 52vw); box-shadow: 0 0 60px rgba(127, 214, 207, .45); border: 2px solid var(--teal); }
.hold .cover .ripple::before, .hold .cover .ripple::after { inset: -10px; border-width: 2px; }

.rolecard { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 20px; text-align: left; width: 100%; align-items: center; background: linear-gradient(160deg, #18224a, #0c1230); border: 1.5px solid rgba(242, 199, 107, .5); border-radius: 16px; padding: 18px; box-shadow: 0 24px 70px -20px rgba(0, 0, 0, .8); }
.rolecard.evil { background: linear-gradient(160deg, #3a1020, #140810); border-color: rgba(226, 86, 106, .6); }
@media (max-width: 640px) { .rolecard { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; } .rolecard figure { max-width: 220px; } }
.rolecard figure { position: relative; margin: 0; width: 100%; }
.rolecard figure img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
.rolecard .rc-side { display: inline-block; font-size: 13px; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--gold); color: var(--gold-hi); }
.rolecard.evil .rc-side { border-color: var(--red); color: var(--red-hi); }
.rc-who { color: var(--dim); font-size: 14px; }
.rc-role { font-family: var(--f-head); font-size: clamp(36px, 6.5vw, 56px); line-height: 1.05; margin: 4px 0 8px; word-break: keep-all; color: var(--gold-hi); }
.rolecard.evil .rc-role { color: var(--red-hi); }
.rc-goal { font-size: 14px; color: var(--ink); margin: 6px 0 4px; }
.know { margin-top: 12px; padding: 10px 12px; border: 1px dashed rgba(238, 241, 251, .3); border-radius: 8px; background: rgba(0, 0, 0, .25); }
.know h4 { font-family: var(--f-head); font-size: 14px; color: var(--dim); font-weight: 700; }
.know .names-list { font-size: 21px; font-family: var(--f-head); font-weight: 800; }
.know .sub { font-size: 13.5px; color: var(--dim); margin-top: 4px; }

/* 원정 카드 */
.cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; perspective: 1000px; }
.mcard { position: relative; width: clamp(110px, 18vw, 170px); aspect-ratio: 5 / 7; border: 0; padding: 0; background: none; transition: translate .35s ease-out, scale .35s ease-out; }
.mcard .face, .mcard .back { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .6s var(--ease), box-shadow .4s; overflow: hidden; box-shadow: 0 14px 30px -12px rgba(0, 0, 0, .8); }
.mcard .back { background: #0d1328 center / cover; border: 1.5px solid rgba(242, 199, 107, .5); }
.mcard .face { transform: rotateY(180deg); display: grid; align-content: end; }
.mcard .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.mcard .face .lab { position: relative; padding: 18px 6px 10px; font-family: var(--f-head); font-weight: 800; font-size: clamp(20px, 3vw, 28px); letter-spacing: .12em; text-align: center; background: linear-gradient(transparent, rgba(0, 0, 0, .75)); }
.mcard .face.ok { border: 2px solid var(--gold); } .mcard .face.ok .lab { color: var(--gold-hi); }
.mcard .face.fail { border: 2px solid var(--red); } .mcard .face.fail .lab { color: var(--red-hi); }
.mcard.open .face { transform: rotateY(0); }
.mcard.open .back { transform: rotateY(-180deg); }
.mcard.static .face { transform: none; }
button.mcard:disabled { cursor: not-allowed; }
button.mcard:disabled .face { filter: grayscale(.9) brightness(.4); }
button.mcard:not(:disabled):hover { translate: 0 -6px; }
.mcard .dis { position: absolute; inset: 40% 6px auto; font-size: 13px; color: #fff; z-index: 2; text-shadow: 0 1px 4px #000; }
.cards.chosen .mcard { pointer-events: none; }
.cards.chosen .mcard:not(.go) { opacity: 0; transition: opacity .25s; }
.mcard.go { animation: sink .6s ease-in forwards; }
.mcard.go .face { transform: rotateY(180deg) !important; }
.mcard.go::after { content: ""; position: absolute; inset: 0; border-radius: 12px; background: var(--back) center / cover; border: 1.5px solid rgba(242, 199, 107, .5); animation: fadeIn .2s both; }
@keyframes sink { 0% { transform: none; } 35% { transform: translateY(-14px) scale(1.04); } 100% { transform: translateY(60px) scale(.7); opacity: 0; } }

/* 원정 결과 공개 */
.ov.rv { background: radial-gradient(ellipse at 50% 40%, #1a2347, #04060f 78%); }
.rv-bg { position: fixed; inset: 0; background: center / cover; opacity: 0; transform: scale(1.08); transition: opacity 1.4s, transform 6s ease-out; z-index: 0; }
.rv-bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(4, 6, 15, .35), rgba(4, 6, 15, .85) 80%); }
.rv-bg.on { opacity: 1; transform: none; }
.ov.rv::before { content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, transparent 25%, rgba(0, 0, 0, .9) 75%); opacity: 0; transition: opacity .8s; }
.ov.rv.tense::before { opacity: 1; }
.rv-head { min-height: clamp(56px, 10vw, 84px); display: grid; place-items: center; }
.rv .cards { flex-wrap: nowrap; gap: clamp(6px, 1.6vw, 16px); }
.rv .mcard { width: clamp(74px, min(18vw, 24vh), 170px); }
.mcard.lift { translate: 0 -16px; scale: 1.06; }
.mcard.lift .back { box-shadow: 0 0 0 2px var(--gold-hi), 0 0 40px rgba(242, 199, 107, .6), 0 24px 40px -12px rgba(0, 0, 0, .9); }
.mcard.tremble { animation: tremble .11s linear infinite; }
.mcard.tremble.hard { animation-duration: .06s; }
@keyframes tremble { 0% { rotate: -1.6deg; } 50% { rotate: 1.6deg; } 100% { rotate: -1.6deg; } }
.mcard.hit .face { box-shadow: 0 0 0 3px var(--red), 0 0 60px rgba(226, 86, 106, .9); animation: hitPulse 1.2s ease-out; }
.mcard.glint .face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255, 240, 200, .75) 50%, transparent 70%); animation: glint .8s ease-out forwards; }
@keyframes glint { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
@keyframes hitPulse { 0% { transform: scale(1.12); } 100% { transform: none; } }
.rv-tally { display: flex; gap: 18px; justify-content: center; font-family: var(--f-head); font-weight: 800; font-size: 18px; }
.rv-tally .a { color: var(--gold-hi); } .rv-tally .f { color: var(--red-hi); }
.rv-tally b { display: inline-block; min-width: 1ch; color: inherit; font-size: 24px; }
.rv-tally b.bump { animation: stamp .5s var(--pop); }
.vstamp { font-family: var(--f-head); font-weight: 800; font-size: clamp(44px, 9vw, 84px); line-height: 1; padding: 6px 22px 10px; border: 5px double currentColor; border-radius: 8px; transform: rotate(-6deg); animation: vslam .6s cubic-bezier(.3, 1.6, .5, 1) both; background: rgba(4, 6, 15, .55); }
.vstamp.ok { color: var(--gold-hi); text-shadow: 0 0 40px rgba(242, 199, 107, .8); }
.vstamp.fail { color: var(--red-hi); text-shadow: 0 0 40px rgba(226, 86, 106, .8); }
@keyframes vslam { 0% { transform: scale(3) rotate(-18deg); opacity: 0; } 55% { opacity: 1; } 100% { transform: rotate(-6deg); opacity: 1; } }
.rv-hint { font-size: 12.5px; color: var(--dim); opacity: .8; }
.flash { position: fixed; inset: 0; z-index: 90; pointer-events: none; animation: flash .7s ease-out forwards; }
.flash.red { background: radial-gradient(circle, rgba(226, 86, 106, .55), rgba(110, 10, 30, .75)); }
.flash.gold { background: radial-gradient(circle, rgba(255, 226, 160, .45), transparent 70%); }
@keyframes flash { from { opacity: 1; } to { opacity: 0; } }
.sparks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 85; }
.bigshield { width: min(130px, 30vw, 18vh); animation: stamp .9s var(--pop); filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .6)); }

/* 표 */
.votebig { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
.votebig button { width: clamp(140px, 32vw, 200px); border: 0; background: none; display: grid; justify-items: center; gap: 6px; padding: 8px; border-radius: 14px; }
.votebig button img { width: 100%; aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 12px 18px rgba(0, 0, 0, .6)); transition: transform .15s; }
.votebig button:hover img { transform: translateY(-4px) rotate(-3deg); }
.votebig .t { font-family: var(--f-head); font-weight: 800; font-size: 28px; }

<script type="module">
import { THEMES, THEME_IDS, ROLE_SIDE, artURL, titleHTML, J, P } from "./themes.js";
(() => {
  // ───────── 규칙 데이터 ─────────

  // 자리 문장 색 (초록 없이)
  const HUES = [["#3f62b8", "#141f4a"], ["#b0404f", "#43111c"], ["#7d52b8", "#2a1546"], ["#2f8296", "#0e2c38"], ["#b5822f", "#472a08"],

    voteMode: p?.voteMode ?? "open", lady: p?.lady ?? ((p?.n ?? 6) >= 7), timer: p?.timer ?? 0, theme: THEME_IDS.includes(p?.theme) ? p.theme : "knights",

  }

      const A = ac();

    UI.timer.iv = setInterval(tickTimer, 250); tickTimer();
  }
  function stopTimer() { if (UI.timer?.iv) clearInterval(UI.timer.iv); UI.timer = null; }
  function tickTimer() {
    const el = document.getElementById("timer"); if (!UI.timer) return;
    const left = Math.max(0, Math.ceil((UI.timer.end - Date.now()) / 1000));
    if (left === 0 && !UI.timer.rang) { UI.timer.rang = true; SFX.bell(); toast("토론 시간이 끝났습니다"); }
    if (left > 0 && left <= 5 && UI.timer.last !== left) SFX.tap();
    UI.timer.last = left;
    if (el) { el.textContent = `⏱ ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`; el.className = `timer ${left ? "run" : "out"}`; }
  }

  // 아는 것
  function knowledge(i) {
    const g = G(), r = roleOf(i), has = k => g.players.some(p => p.role === k);
    const others = g.players.map((_, j) => j).filter(j => j !== i);
    const list = js => js.map(j => `<b>${esc(nameOf(j))}</b>`).join(", ");
    if (r === "star") {
      const seen = others.filter(j => sideOf(j) === "evil" && roleOf(j) !== "newmoon");
      return { h: T.kn.starH, body: seen.length ? list(seen) : "아무도 보이지 않습니다", sub: (has("newmoon") ? T.kn.starHidden + " " : "") + "누가 어떤 역할인지는 모릅니다." };
    }
    if (r === "watch") {
      const seen = shuffle(others.filter(j => ["star", "wisp"].includes(roleOf(j))));
      return { h: T.kn.watchH, body: list(seen), sub: seen.length > 1 ? T.kn.watch2 : `이 사람이 ${ROLES.star.name}입니다. ${ROLES.assassin.name}에게 들키지 않게 지켜 주세요.` };
    }
    if (r === "wander") return { h: T.kn.wanderH, body: "동료를 모릅니다", sub: `다른 ${SIDE.evil} 편도 당신을 모릅니다. ${ROLES.star.name}에게는 보입니다. 원정에서 ${J(T.cardB, "을", "를")} 낼 수 있습니다.` };
    if (ROLES[r].side === "evil") {
      const mates = others.filter(j => sideOf(j) === "evil" && roleOf(j) !== "wander");
      const subs = [];
      if (r === "assassin") subs.push(`${T.lit3If} ${J(ROLES.star.name, "을", "를")} 한 번 지목합니다. 맞히면 ${J(SIDE.evil, "이", "가")} 이깁니다.`);
      if (r === "wisp") subs.push(`${ROLES.watch.name}에게는 당신이 ${ro(ROLES.star.name)} 보입니다.`);
      if (r === "newmoon") subs.push(`${J(ROLES.star.name, "은", "는")} 당신을 보지 못합니다.`);
      if (has("wander")) subs.push(T.kn.wanderHere);
      subs.push(`원정에서 ${J(T.cardG, "과", "와")} ${T.cardB} 중 하나를 고를 수 있습니다.`);
      return { h: T.kn.evilH, body: mates.length ? list(mates) : "없음", sub: subs.join(" ") };
    }
    return { h: "아는 것", body: "없음", sub: `${T.kn.guardSub} 원정에서는 ${T.cardG}만 낼 수 있습니다.` };
  }

  // ───────── 그리기 ─────────
  function questHTML(n, g, r, sz) {
    const q = g?.quests[r], now = g && !["end", "reveal"].includes(g.step) && r === g.round && !q;
    const st = q ? q.result : now ? "now" : "future";
    const sh = q ? (q.result === "ok" ? "sh_ok" : "sh_fail") : "sh_empty";
    const lab = q ? (q.result === "ok" ? T.okShort : `${T.failShort} · ${T.cardB} ${q.fails}`) : sz;
    return `<div class="quest ${st} ${UI.justDone === r ? "just" : ""}">
      <div class="sh"><img src="${img(sh)}" alt=""><span class="n">${r + 1}</span></div>
      <div class="lab"><b>${ORD[r]}</b>${lab}${needTwo(n, r) && !q ? `<br><span class="two">${T.cardB} 2장</span>` : ""}</div>
    </div>`;
  }
  function renderQuests() {
    const game = S.phase === "game", n = game ? N() : S.cfg.n, g = game ? G() : null;
    $("quests").innerHTML = SIZES[n].map((sz, r) => questHTML(n, g, r, `원정대 ${sz}명`)).join("");
    const hero = $("hero"), end = g?.step === "end";
    hero.classList.toggle("win", end && g.winner === "good");
    hero.classList.toggle("lose", end && g.winner === "evil");
  }
  function rejectsHTML(k) {
    let s = ""; for (let i = 0; i < 5; i++) s += `<i class="${i < k ? "on" : ""} ${i === 4 ? "last" : ""}"></i>`;
    return `<span class="rejects" title="같은 ${T.unit}에서 다섯 번 연달아 부결되면 ${SIDE.evil} 승리">${s}<span>부결 ${k}/5</span></span>`;
  }
  function renderTop() {
    const nav = [`<a class="btn sm" href="./" aria-label="처음 화면">←<span class="long"> 처음 화면</span></a>`];
    const g = S.phase === "game" ? G() : null;
    if (g && S.undo?.length && UNDO_STEPS.includes(g.step)) nav.push(`<button class="btn sm" data-act="undo" aria-label="되돌리기">↶<span class="long"> 되돌리기</span></button>`);
    if (g && !["end", "reveal"].includes(g.step)) nav.push(`<button class="btn sm" data-act="recheck">내 역할</button>`);
    nav.push(`<button class="btn sm" data-act="sound" aria-pressed="${pref.sound}" aria-label="소리">${pref.sound ? "♪<span class=long> 소리</span>" : "♪ 끔"}</button>`);
    nav.push(`<button class="btn sm" data-act="rules">규칙</button>`);
    if (g) nav.push(`<button class="btn sm" data-act="quit">처음<span class="long">으로</span></button>`);
    $("topnav").innerHTML = nav.join("");
    document.body.classList.toggle("ingame", !!g && g.step !== "end");
  }

  // ── 탁자: 자리·표식·대장 표식을 한 번 만들고, 이후엔 상태만 바꾼다 (움직임이 이어지게) ──
  const R_SEAT = 40, R_TOK = 25.5;
  const pos = (i, n, r) => { const a = 2 * Math.PI * i / n; return [50 + r * Math.sin(a), 50 - r * Math.cos(a)]; };
  function stageSkeleton() {
    const g = G(), n = N(), key = g.players.map(p => p.name).join("|") + g.started;
    let st = $("stage");
    if (st && st.dataset.key === key) return st;
    const seats = g.players.map((p, i) => {
      const [x, y] = pos(i, n, R_SEAT);
      return `<button class="seat" data-i="${i}" style="left:${x}%;top:${y}%;${hue(i)}" aria-label="${esc(p.name)}">
        <span class="med"><span class="f">${esc([...p.name][0])}</span><span class="b"></span></span>
        <img class="seal" alt=""><span class="chk">확인</span><span class="nm">${esc(p.name)}</span></button>`;
    }).join("");
    const toks = g.players.map((_, i) => { const [x, y] = pos(i, n, R_TOK); return `<img class="tok" data-i="${i}" src="${img("token")}" alt="" style="left:${x}%;top:${y}%">`; }).join("");
    $("stageWrap").innerHTML = `<div class="stage" id="stage" data-key="${esc(key)}"><div class="table"></div><div class="hub" id="hub"></div>${toks}${seats}
      <div class="orbit off" id="ladyOrbit"><span class="o-item"><img class="lady-tok" src="${img("lantern")}" alt="${T.lamp}"></span></div>
      <div class="orbit off" id="crownOrbit"><span class="o-item"><img class="crown-tok" src="${img("crown")}" alt="${T.leader}"></span></div></div>`;
    UI.crownA = null; UI.ladyA = null; UI.hubKey = "";
    const st2 = $("stage"), unit = () => { if (st2.clientWidth) st2.style.setProperty("--u", `${st2.clientWidth / 100}px`); };
    unit(); if (window.ResizeObserver) new ResizeObserver(unit).observe(st2); else addEventListener("resize", unit);
    return st2;
  }
  // 대장 표식·등불을 탁자 둘레를 따라 옮긴다 (가까운 쪽으로)
  function orbitTo(id, seat, prevKey, extra) {
    const o = $(id), it = o.querySelector(".o-item"), n = N(), target = 360 * seat / n;
    let A = UI[prevKey];
    if (A == null) { A = target; o.style.transition = it.style.transition = "none"; }
    else { let d = ((target - A) % 360 + 540) % 360 - 180; A += d; o.style.transition = it.style.transition = ""; if (Math.abs(d) > 1) { o.classList.remove("bounce"); void o.offsetWidth; o.classList.add("bounce"); } }
    UI[prevKey] = A;
    o.style.transform = `rotate(${A}deg)`;
    it.style.transform = `translate(-50%,-50%) translateY(calc(-${R_SEAT} * var(--u))) rotate(${-A}deg) ${extra}`;
    if (o.style.transition === "none") { void o.offsetWidth; requestAnimationFrame(() => { o.style.transition = it.style.transition = ""; }); }
  }

  function seatMode(step) {
    if (step === "reveal") return "reveal";
    if (step === "team") return "pick";
    if (step === "vote") return S.cfg.voteMode === "open" ? "openvote" : "secret";
    if (step === "voteResult") return "result";
    if (step === "lady") return "lady";
    if (step === "assassin") return "target";
    return "none";
  }
  function renderStage() {
    const g = G(), n = N(), st = stageSkeleton(), mode = seatMode(g.step);
    const showTeam = ["team", "vote", "voteResult", "mission", "missionReveal"].includes(g.step);
    const lastVote = g.history[g.history.length - 1];
    const order = g.players.map((_, k) => (g.leader + k) % n);
    st.classList.toggle("dark", g.step === "assassin");
    st.classList.toggle("water", g.step === "lady");
    st.querySelectorAll(".seat").forEach(el => {
      const i = +el.dataset.i, cls = ["seat"], on = showTeam && g.team.includes(i);
      let act = "", label = nameOf(i), seal = "";
      if (showTeam && i === g.leader) { cls.push("lead"); label += `, ${T.leader}`; }
      if (on) { cls.push("on"); label += ", 원정대"; }
      if (mode === "reveal") { act = "role"; cls.push("pickable"); if (g.seen[i]) cls.push("seen"); }
      if (mode === "pick") { act = "pick"; cls.push("pickable"); }
      if (mode === "openvote") {
        act = "tvote"; cls.push("pickable");
        if (g.votes[i] != null) { cls.push("sv", g.votes[i] ? "yes" : "no"); seal = g.votes[i] ? "seal_yes" : "seal_no"; }
      }
      if (mode === "secret" && g.votes[i] != null) cls.push("voted");
      if (mode === "result" && lastVote) {
        const v = lastVote.votes[i]; seal = v ? "seal_yes" : "seal_no"; cls.push("sv", v ? "yes" : "no"); label += v ? ", 찬성" : ", 반대";
        if (UI.voteFlash) { cls.push("anim"); el.style.setProperty("--d", `${200 + order.indexOf(i) * 150}ms`); }
      }
      if (mode === "target") {
        if (sideOf(i) === "evil") cls.push("showrole", "evil");
        else { act = "target"; cls.push("pickable"); }
        if (g.target === i) cls.push("target");
      }
      if (mode === "lady") {
        const L = g.lady;
        if (i === L.holder) {}
        else if (L.past.includes(i)) cls.push("past");
        else { act = "ladypick"; cls.push("pickable"); }
        if (L.pick === i) cls.push("target", "pick-lady");
      }
      const b = el.querySelector(".med .b");
      if (cls.includes("showrole")) b.style.backgroundImage = `url(${img(g.players[i].art)})`;
      el.className = cls.join(" ");
      if (act) { el.dataset.act = act; el.disabled = false; } else { delete el.dataset.act; el.disabled = true; }
      el.setAttribute("aria-label", label);
      const si = el.querySelector(".seal");
      if (seal) { if (si.dataset.k !== seal) { si.src = img(seal); si.dataset.k = seal; } } else { si.removeAttribute("src"); si.dataset.k = ""; }
    });
    st.querySelectorAll(".tok").forEach(t => t.classList.toggle("show", showTeam && g.team.includes(+t.dataset.i)));
    // 대장 표식
    const crownOn = !["assassin", "lady"].includes(g.step) && (g.step !== "reveal" || g.seen.every(Boolean));
    $("crownOrbit").classList.toggle("off", !crownOn);
    orbitTo("crownOrbit", g.leader, "crownA", "translateY(calc(-7.4 * var(--u)))");
    // 등불
    const ladyOn = !!g.lady && g.step !== "assassin";
    $("ladyOrbit").classList.toggle("off", !ladyOn);
    if (g.lady) orbitTo("ladyOrbit", g.lady.holder, "ladyA", "translate(calc(5 * var(--u)), calc(4.2 * var(--u)))");
    renderHub();
  }
  function renderHub() {
    const g = G(), n = N(), need = SIZES[n][g.round];
    const key = [g.step, g.round, g.team.length, Object.keys(g.votes).length, g.cards.length, g.rejects, g.lady?.pick, g.target, g.seen.filter(Boolean).length, g.history.length].join("|");
    if (key === UI.hubKey) return; const prev = UI.hubKey; UI.hubKey = key;
    let h = "";
    const pips = k => { let s = ""; for (let i = 0; i < need; i++) s += `<i class="${i < k ? "on" : ""}"></i>`; return `<div class="pips">${s}</div>`; };
    switch (g.step) {
      case "reveal": {
        const k = g.seen.filter(Boolean).length;
        h = `<p class="hk">역할 확인</p><p class="hbig">${k} / ${n}</p><p class="hs">${k === n ? "모두 확인했습니다" : "자기 자리를 눌러<br>몰래 확인하세요"}</p>`; break;
      }
      case "team":
        h = `<div class="sh"><img src="${img("sh_empty")}" alt=""><span>${g.round + 1}</span></div><p class="hk">${ORD[g.round]} ${T.unit}</p>${pips(g.team.length)}<p class="hs">원정대 ${g.team.length} / ${need}${needTwo(n, g.round) ? ` · ${T.cardB} 2장` : ""}</p>`; break;
      case "vote": {
        const k = Object.keys(g.votes).length;
        h = `<p class="hk">${S.cfg.voteMode === "open" ? "표결 · 엄지로" : "표결 · 몰래"}</p><p class="hbig">${k} / ${n}</p><p class="hs">${S.cfg.voteMode === "open" ? "하나, 둘, 셋!" : "차례로 몰래 냅니다"}</p>`; break;
      }
      case "voteResult": {
        const last = g.history[g.history.length - 1], yes = last.votes.filter(Boolean).length, d = UI.voteFlash ? 350 + n * 150 : 0;
        h = `<p class="bigstamp ${last.ok ? "ok" : "bad"} ${d ? "slam" : ""}" style="--d:${d}ms">${last.ok ? "가결" : "부결"}</p><p class="hs after" style="--d:${d + 300}ms;margin-top:calc(1.6 * var(--u))">찬성 ${yes} · 반대 ${n - yes}</p>`; break;
      }
      case "mission": case "missionReveal": {

        const grew = pk[0] === "mission" && +pk[4] < k;

        h = `<div class="pile">${s}</div><p class="hk" style="margin-top:calc(1.4 * var(--u))">${ORD[g.round]} ${T.unit}</p><p class="hs">${g.step === "mission" ? `카드 ${k} / ${g.team.length}` : "결과 공개"}</p>`; break;
      }
      case "lady":
        h = `<div class="ripple"><img class="roundimg" src="${img("lantern")}" alt=""></div><p class="hk" style="margin-top:calc(1.6 * var(--u));color:var(--teal)">${T.lamp}</p>`; break;
      case "assassin":
        h = `<img class="roundimg red" src="${img("assassin")}" alt=""><p class="hk" style="margin-top:calc(1.6 * var(--u));color:var(--red-hi)">${J(ROLES.star.name, "은", "는")} 누구인가</p>`; break;
    }
    $("hub").innerHTML = `<div class="hub-in">${h}</div>`;
  }

      items.push({ round: h.round, k: 0, html: `<div class="log-item ${h.ok ? "ok" : "bad"}"><span class="t">${ORD[h.round]} ${T.unit} · ${T.leader} ${esc(nameOf(h.leader))}<em>${h.attempt}번째 제안</em></span><br>

  }

  function renderSetup() {

    $("main").innerHTML = `
      <div class="setup">
        <section class="panel stack">
          ${themes ? `<div><p class="kicker">테마</p><h3>어느 밤으로 갈까요</h3></div>

          <p class="note">규칙은 같고 이름과 그림만 바뀝니다. 판 중에는 바꿀 수 없습니다.</p>` : ""}

            <div class="stepper"><button class="btn" data-act="n-" aria-label="한 명 빼기" ${c.n <= 5 ? "disabled" : ""}>−</button><output>${c.n}</output><button class="btn" data-act="n+" aria-label="한 명 더하기" ${c.n >= 10 ? "disabled" : ""}>+</button></div>
            <p class="split"><span class="g">${SIDE.good} ${good}</span> · <span class="e">${SIDE.evil} ${evil}</span></p>
          </div>
