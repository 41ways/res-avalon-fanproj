<!doctype html>
<html lang="ko" data-theme="knights">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resistance:AVALON — 마피아 추리 온라인 파티 게임</title>
<meta name="description" content="5~10명이 각자 폰으로 들어와 하는 숨은 역할 게임. 방을 만들고 초대 코드로 모여 다섯 원정을 떠난다. 은빛 서약 · 봉화 두 테마.">
<meta property="og:title" content="Resistance:AVALON — 마피아 추리 온라인 파티 게임">
<meta property="og:description" content="방을 만들고 친구를 불러 5~10명이 하는 숨은 역할 게임. 비공식 팬 프로젝트.">
<meta property="og:image" content="https://res-avalon-fanproj.41ways.workers.dev/art/og.jpg">
<meta name="theme-color" content="#0b1124">
<link rel="icon" href="art/knights/crown.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=East+Sea+Dokdo&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&family=Song+Myung&display=swap">
<link rel="stylesheet" href="style.css?v=2">
<style>
/* ── 온라인 전용: 처음 화면 · 방 목록 · 대기실 · 채팅 ── */
:root { --bgimg: url(art/knights/bg.webp); --tok: url(art/knights/token.webp); --back: url(art/knights/back.webp); }
html[data-theme="bonghwa"] { --gold: #FF8A3D; --gold-hi: #FFC86B; --gold-deep: #B4421A; --bg: #0A0F1E; --bg-2: #131B31; }
html[data-theme="bonghwa"] .brand h1 { font-family: "East Sea Dokdo", "Song Myung", serif; letter-spacing: .02em; font-weight: 400; }
html[data-theme="bonghwa"] .quest .sh .n { display: none; }
.hero.title { min-height: min(78vh, 640px); display: grid; align-content: end; }
.hero.title .topnav { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); right: max(16px, env(safe-area-inset-right, 0px)); }
.hero.title .brand { flex-direction: column; align-items: flex-start; gap: 6px; }
.hero.title .brand h1 { font-size: clamp(56px, 12vw, 132px); }
.hero.title .brand p { font-size: clamp(15px, 2.4vw, 20px); }
.title-acts { display: flex; flex-wrap: wrap; gap: 12px; padding: 26px 0 40px; }
.title-acts .btn { min-width: 180px; }
.online { color: var(--dim); font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.online i { width: 8px; height: 8px; border-radius: 50%; background: #6fcf97; box-shadow: 0 0 8px #6fcf97; }
.online.off i { background: var(--dim); box-shadow: none; }
.feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin: 8px 0 26px; }
.feat .panel h3 { font-size: 18px; }
.feat .panel p { color: var(--dim); font-size: 14.5px; }
.themes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.themes button { display: grid; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0, 0, 0, .2); text-align: left; }
.themes button[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; background: rgba(242, 199, 107, .07); }
.themes img { width: 100%; aspect-ratio: 16 / 7; object-fit: cover; border-radius: 6px; }
.themes .t { font-family: var(--f-head); font-weight: 700; font-size: 17px; }
.themes .d { color: var(--dim); font-size: 13px; }
.lobby-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; padding: 22px 0 10px; }
@media (max-width: 880px) { .lobby-grid { grid-template-columns: minmax(0, 1fr); } }
.field { display: grid; gap: 6px; }
.field label, .sub-h { font-size: 13px; color: var(--dim); }
.inp { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0, 0, 0, .3); font-size: 16px; }
.inp:focus { outline: none; border-color: var(--gold); }
.code-inp { text-transform: uppercase; letter-spacing: .3em; font-family: var(--f-head); font-weight: 800; max-width: 9em; }
.rlist { display: grid; gap: 8px; }
.ritem { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0, 0, 0, .22); text-align: left; width: 100%; }
.ritem:not(:disabled):hover { border-color: rgba(242, 199, 107, .55); background: rgba(242, 199, 107, .06); }
.ritem img { width: 64px; height: 44px; object-fit: cover; border-radius: 6px; }
.ritem .t { font-family: var(--f-head); font-weight: 700; font-size: 16px; }
.ritem .m { color: var(--dim); font-size: 13px; }
.ritem .st { font-size: 12.5px; padding: 3px 9px; border-radius: 99px; border: 1px solid var(--line); white-space: nowrap; }
.ritem .st.wait { color: #6fcf97; border-color: rgba(111, 207, 151, .5); }
.ritem .st.playing { color: var(--red-hi); border-color: rgba(226, 86, 106, .5); }
.ritem:disabled { opacity: .55; cursor: default; }
.empty { color: var(--dim); font-size: 14.5px; padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 10px; }
.roomcode { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.roomcode b { font-family: var(--f-head); font-weight: 800; font-size: 34px; letter-spacing: .25em; color: var(--gold-hi); }
.seatlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.slot { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0, 0, 0, .22); min-height: 52px; }
.slot .av { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-head); font-weight: 800; background: radial-gradient(circle at 40% 35%, var(--c1), var(--c2)); border: 1.5px solid rgba(255, 255, 255, .3); }
.slot .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.slot .tag { font-size: 11.5px; color: var(--gold-hi); }
.slot.me { border-color: rgba(242, 199, 107, .55); }
.slot.off { opacity: .5; }
.slot.free { color: var(--dim); font-size: 13px; justify-content: center; border-style: dashed; }
.slot .x { border: 0; background: none; color: var(--dim); font-size: 18px; padding: 0 4px; }
.chatbox { display: grid; gap: 8px; }
.chatlog { height: 190px; overflow-y: auto; display: grid; align-content: start; gap: 4px; font-size: 14px; padding-right: 4px; overscroll-behavior: contain; }
.chatlog .c b { color: var(--gold-hi); font-weight: 700; margin-right: 6px; }
.chatlog .c.sys { color: var(--dim); font-size: 13px; }
.chatlog .c.mine b { color: var(--teal); }
.chatform { display: flex; gap: 8px; }
.chatform .inp { padding: 9px 12px; font-size: 15px; min-width: 0; }
.chatform .btn { white-space: nowrap; flex: none; }
.waitnote { color: var(--dim); font-size: 14px; }
.myturn { animation: glow 1.6s ease-in-out infinite alternate; }
@keyframes glow { from { box-shadow: 0 0 0 0 rgba(242, 199, 107, .0); } to { box-shadow: 0 0 0 4px rgba(242, 199, 107, .25); } }
.vbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vbtns button { display: grid; justify-items: center; gap: 4px; padding: 12px 8px; border-radius: 10px; border: 1.5px solid var(--line); background: rgba(0, 0, 0, .25); }
.vbtns button img { width: 44px; height: 44px; }
.vbtns button { padding: 8px 6px; }
.vbtns button .t { font-family: var(--f-head); font-weight: 800; font-size: 18px; }
.vbtns button[aria-pressed="true"].y { border-color: var(--gold); background: rgba(242, 199, 107, .12); }
.vbtns button[aria-pressed="true"].n { border-color: var(--red); background: rgba(226, 86, 106, .12); }
.conn { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 10px); transform: translateX(-50%); z-index: 80; background: rgba(109, 22, 38, .92); border: 1px solid var(--red); padding: 6px 14px; border-radius: 99px; font-size: 13.5px; }
.seat.voted::after { content: "✓"; position: absolute; right: 8%; top: 4%; width: calc(4 * var(--u)); height: calc(4 * var(--u)); border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #2a1a05; font-size: calc(2.4 * var(--u)); font-weight: 800; }
.seat.offline .med { filter: grayscale(1) brightness(.5); }
.seat.me .nm { color: var(--gold-hi); }

/* ── 채팅은 늘 손 닿는 곳: 넓은 화면은 오른쪽 기둥을 채우고, 좁은 화면은 아래에 붙는다 ── */
.left { display: grid; gap: 14px; align-content: start; }
.chat-tog { display: none; }
.lobby-grid.room { grid-template-columns: minmax(0, 1.15fr) minmax(330px, 410px); }
.lobby-grid.room .themes img { aspect-ratio: 16 / 5; }
.lobby-grid.room .comp { grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; }
.lobby-grid.room .chip .cap { font-size: 11.5px; padding: 12px 4px 4px; }
.lobby-grid.room .opt { padding: 8px 10px; }
.seatlist { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.slot { min-height: 44px; padding: 6px 8px; gap: 8px; }
.slot .av { width: 28px; height: 28px; font-size: 14px; }
.slot .nm { font-size: 14px; line-height: 1.25; }
@media (min-width: 901px) {
  .side, .room-side { position: sticky; top: 8px; height: calc(100svh - 74px); display: flex; flex-direction: column; gap: 12px; }
  .side > .qt, .room-side > .panel:not(.chatbox) { flex: none; }
  .side > .dock { flex: none; }
  .side > .chatbox, .room-side > .chatbox { padding: 12px 14px; gap: 6px; }
  .side > .chatbox h3 { font-size: 16px; margin: 0; }
  .side { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .side > .chatbox, .room-side > .chatbox { flex: 1 1 auto; min-height: 150px; display: flex; flex-direction: column; }
  .chatbox .chatlog { flex: 1 1 auto; height: auto; min-height: 0; }
  .end-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 20px; align-items: start; padding-top: 10px; }
}
@media (max-width: 900px) {
  .lobby-grid.room { grid-template-columns: minmax(0, 1fr); }
  .lobby-grid.room > section.stack { display: contents; }
  .lobby-grid.room #lobbyHall { order: 0; }
  .lobby-grid.room .room-side { order: 1; display: grid; gap: 12px; }
  .lobby-grid.room > section.stack > .panel { order: 2; }
  .left { display: contents; }
  .board .stage-wrap { order: 0; } .board .dock { order: 1; } .board .chron { order: 2; }
  .end-grid { display: grid; gap: 14px; padding-top: 10px; }
  body.has-chat { padding-bottom: calc(128px + env(safe-area-inset-bottom, 0px)); }
  .chatbox.float { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; margin: 0; border-radius: 14px 14px 0 0; border-bottom: 0;
    padding: 6px max(12px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)); gap: 6px;
    background: rgba(9, 13, 28, .97); box-shadow: 0 -10px 30px rgba(0, 0, 0, .5); }
  .chatbox.float h3 { display: none; }
  .chatbox.float .chatlog { height: 62px; font-size: 13.5px; }
  .chatbox.float.open .chatlog { height: 42vh; }
  .chat-tog { display: inline-grid; place-items: center; flex: none; width: 40px; padding: 0; }
}

/* ── 장면: 내 자리에서 본 탁자. 다른 사람은 건너편 의자에 초상 카드로 앉는다 ── */
.stage-wrap { width: 100%; }
.hall { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; isolation: isolate; --u: 6px; --cw: 9.8%;
  background: #070a14 var(--hallimg) center 60% / cover no-repeat; user-select: none; -webkit-user-select: none;
  box-shadow: 0 40px 90px -40px #000, 0 0 0 1px rgba(242, 199, 107, .22), inset 0 0 0 1px rgba(0, 0, 0, .6); transition: filter 1s; }
.hall-v { position: absolute; inset: 0; z-index: 1; pointer-events: none;
  background: radial-gradient(ellipse 75% 70% at 50% 62%, transparent 50%, rgba(4, 6, 14, .72) 100%), linear-gradient(180deg, rgba(4, 6, 14, .35), transparent 28%); }
.hall.dark { filter: saturate(.75) brightness(.8) sepia(.25) hue-rotate(-18deg); }
.hall.water .hall-v { background: radial-gradient(ellipse 75% 70% at 50% 62%, rgba(127, 214, 207, .08) 30%, rgba(4, 6, 14, .72) 100%); }
.hall .hub { position: absolute; left: 47%; top: 77%; width: 40%; height: 30%; transform: translate(-50%, -50%); z-index: 5; display: grid; place-items: center; text-align: center; pointer-events: none; border-radius: 0; }
.hall .hk, .hall .hs { text-shadow: 0 1px 6px #000, 0 0 2px #000; }
.hall .hub::before { content: ""; position: absolute; inset: -6% -4%; z-index: -1; border-radius: 50%; background: radial-gradient(ellipse at 50% 50%, rgba(5, 7, 15, .78) 0%, rgba(5, 7, 15, .5) 45%, transparent 72%); }
.hall .hk { color: var(--gold-hi); }
.pc { position: absolute; width: calc(var(--cw) * var(--s)); transform: translate(-50%, -100%); border: 0; padding: 0; background: none; display: grid; justify-items: center; gap: calc(var(--u) * .5);
  font-size: max(10px, calc(var(--u) * 1.45 * var(--s))); transition: left .7s var(--ease), top .7s var(--ease), width .7s var(--ease), opacity .4s; touch-action: manipulation; }
.pc:disabled { cursor: default; }
.pc-fr { position: relative; width: 100%; aspect-ratio: 4 / 5; border-radius: 12% 12% 7% 7% / 10% 10% 6% 6%; overflow: hidden; background: #0c1020;
  border: max(1.5px, calc(var(--u) * .32)) solid #b99a58; transition: border-color .35s, box-shadow .35s, transform .25s, filter .4s;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .7), 0 calc(var(--u) * 1.4) calc(var(--u) * 2.4) rgba(0, 0, 0, .75); }
.pc-fr::after { content: ""; position: absolute; inset: 0; z-index: 3; pointer-events: none; border-radius: inherit;
  box-shadow: inset 0 0 0 max(1px, calc(var(--u) * .2)) rgba(255, 230, 170, .28), inset 0 calc(var(--u) * -3) calc(var(--u) * 3) rgba(4, 6, 14, .55); }
.pc-pt, .pc-rl { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: filter .4s, opacity .7s; }
.pc-rl { opacity: 0; z-index: 1; }
.pc.showrole .pc-rl { opacity: 1; }
.pc-nm { position: relative; z-index: 2; font-family: var(--f-head); font-weight: 700; color: var(--ink); white-space: nowrap; max-width: 170%; overflow: hidden; text-overflow: ellipsis;
  padding: .12em .65em; border-radius: 3px; border: 1px solid rgba(242, 199, 107, .35); background: linear-gradient(180deg, rgba(24, 31, 58, .95), rgba(8, 12, 26, .95)); box-shadow: 0 2px 8px rgba(0, 0, 0, .7); transition: color .3s, border-color .3s, background .3s; }
.pc-tok { position: absolute; left: 50%; top: calc(100% + var(--u) * .4); width: 42%; transform: translate(-50%, 0) scale(0); transition: transform .4s var(--pop); filter: drop-shadow(0 calc(var(--u) * .6) calc(var(--u) * .8) rgba(0, 0, 0, .7)); pointer-events: none; }
.pc.on .pc-tok { transform: translate(-50%, 0) scale(1); }
.pc.me .pc-tok { top: auto; bottom: calc(100% - var(--u) * 2); left: calc(100% + var(--u) * 2); width: 34%; }
.pc-seal { position: absolute; left: 50%; top: 46%; width: 72%; z-index: 4; transform: translate(-50%, -50%) scale(0) rotate(-12deg); opacity: 0; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .6)); }
.pc.sv .pc-seal { opacity: 1; transform: translate(-50%, -50%) rotate(-12deg); }
.pc.sv.anim .pc-seal { animation: pcSeal .5s var(--d, 0ms) cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes pcSeal { 0% { transform: translate(-50%, -50%) scale(2.4) rotate(-30deg); opacity: 0; } 100% { transform: translate(-50%, -50%) rotate(-12deg); opacity: 1; } }
.pc.no .pc-pt { filter: saturate(.5) brightness(.6); }
.pc-chk { position: absolute; right: 5%; top: 4%; z-index: 4; width: 26%; aspect-ratio: 1; border-radius: 50%; display: none; place-items: center; background: var(--gold); color: #2a1a05; font-weight: 800; font-size: max(9px, calc(var(--u) * 1.5 * var(--s))); box-shadow: 0 2px 6px rgba(0, 0, 0, .6); }
.pc.voted .pc-chk, .pc.seen .pc-chk { display: grid; animation: pipIn .35s var(--pop); }
.pc.lead .pc-nm { color: var(--gold-hi); border-color: var(--gold); }
.pc.on .pc-fr { border-color: var(--gold-hi); box-shadow: 0 0 0 max(1px, calc(var(--u) * .3)) rgba(242, 199, 107, .35), 0 0 calc(var(--u) * 3.4) rgba(242, 199, 107, .65), 0 calc(var(--u) * 1.4) calc(var(--u) * 2.4) rgba(0, 0, 0, .75); }
.pc.on .pc-nm { background: linear-gradient(180deg, rgba(110, 78, 20, .96), rgba(60, 40, 8, .96)); border-color: var(--gold); color: #fff; }
.pc.pickable { cursor: pointer; }
.pc.pickable .pc-fr { animation: beckon 2.4s ease-in-out infinite; }
.pc.pickable:hover .pc-fr { transform: translateY(calc(var(--u) * -.8)); }
@keyframes beckon { 50% { box-shadow: 0 0 0 max(1px, calc(var(--u) * .3)) rgba(242, 199, 107, .25), 0 0 calc(var(--u) * 2.4) rgba(242, 199, 107, .35), 0 calc(var(--u) * 1.4) calc(var(--u) * 2.4) rgba(0, 0, 0, .75); } }
.pc.past { opacity: .45; }
.pc.offline .pc-pt { filter: grayscale(1) brightness(.4); }
.pc.offline .pc-nm { color: var(--dim); }
.pc.target .pc-fr { border-color: var(--red); box-shadow: 0 0 0 max(1px, calc(var(--u) * .35)) rgba(226, 86, 106, .4), 0 0 calc(var(--u) * 4) rgba(226, 86, 106, .9); }
.pc.pick-lamp .pc-fr { border-color: var(--teal); box-shadow: 0 0 calc(var(--u) * 4) rgba(127, 214, 207, .8); }
.pc.evil.showrole .pc-fr { border-color: var(--red); }
.pc.me .pc-nm { border-color: rgba(127, 214, 207, .5); }
.h-crown, .h-lamp { position: absolute; z-index: 60; transform: translate(-50%, -100%); pointer-events: none; transition: left .75s var(--ease), top .75s var(--ease), opacity .35s; }
.h-crown { width: calc(var(--cw) * .66); filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .65)) drop-shadow(0 0 14px rgba(255, 226, 160, .55)); }
.h-lamp { width: calc(var(--cw) * .5); transform: translate(-50%, -50%); filter: drop-shadow(0 0 12px rgba(127, 214, 207, .8)); }
.h-crown.off, .h-lamp.off { opacity: 0; }
/* 대기실: 들어온 사람이 촛불처럼 나타나고, 나간 사람은 흐려진다 */
.pc.arrive { animation: arrive .9s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes arrive { 0% { opacity: 0; transform: translate(-50%, -88%) scale(.82); filter: blur(8px) brightness(2.2); } 60% { opacity: 1; filter: blur(0) brightness(1.4); } 100% { transform: translate(-50%, -100%); filter: none; } }
.pc.leave { opacity: 0; transform: translate(-50%, -92%) scale(.9); filter: blur(6px); transition: opacity .4s, transform .4s, filter .4s; }
/* 판 시작: 카드가 탁자 가운데에서 제자리로 */
.hall.deal .pc { animation: hallDeal .8s var(--d, 0ms) cubic-bezier(.2, .9, .3, 1) both; }
@keyframes hallDeal { 0% { opacity: 0; transform: translate(-50%, -40%) scale(.5); filter: blur(4px); } 100% { opacity: 1; transform: translate(-50%, -100%); filter: none; } }
.cine.immerse { background: #04060d; }
.cine.immerse .imm { position: absolute; inset: 0; background: center 60% / cover no-repeat; animation: dive 3.6s cubic-bezier(.45, 0, .25, 1) both; }
.cine.immerse .imm-v { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 60%, transparent 30%, rgba(4, 6, 13, .92) 100%); animation: fadeIn 1.2s both; }
.cine.immerse .cine-txt { position: relative; z-index: 2; }
@keyframes dive { 0% { transform: scale(1); filter: brightness(.95); } 100% { transform: scale(1.55) translateY(7%); filter: brightness(.5) blur(1.5px); } }
#lobbyHall { margin-bottom: 4px; }
@media (max-width: 900px) {
  .hall { aspect-ratio: 4 / 3; --cw: 12.5%; border-radius: 12px; }
  .hall .hub { top: 80%; left: 42%; width: 62%; }
  .pc-nm { max-width: 220%; }
}
.flipcard { border: 0; padding: 0; background: none; cursor: pointer; transition: transform .2s; }
.flipcard:hover { transform: translateY(-4px) rotate(-1deg); }

/* 건너편 사람: 액자 없이 의자에 앉은 인물. 아래쪽은 탁자에 스며들게 흐린다 */
.pc.fig { width: calc(var(--cw) * 1.38 * var(--s)); gap: 0; }
.pc.fig .pc-fr { aspect-ratio: auto; overflow: visible; border: 0; border-radius: 0; background: none; box-shadow: none; }
.pc.fig .pc-fr::after { display: none; }
.pc.fig .pc-pt { position: relative; display: block; width: 100%; height: auto; object-fit: contain;
