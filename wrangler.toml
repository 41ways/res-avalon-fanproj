# 은빛 서약·봉화 — Cloudflare Workers 무료 플랜 (뱅과 같은 계정·같은 짜임)
# 화면 파일은 정적 자산으로, 소켓(/ws)만 Worker → Durable Object(하나) 로 간다.
name = "res-avalon-fanproj"
main = "src/worker.js"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/ws", "/healthz"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "RaHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RaHub"]
